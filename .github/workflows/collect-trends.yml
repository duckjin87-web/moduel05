# 트렌드 데이터 서버사이드 자동 수집
# ─────────────────────────────────────────────
# 6시간마다 4대 신호(기후·사회·경제·문화)를 GitHub 러너에서 직접 수집해
# data/trends.json으로 커밋한다. 프론트엔드는 이 파일을 same-origin으로
# 읽으므로 내부망에서 외부 CORS 프록시가 차단돼도 실데이터가 표시된다.
#
# 리포지토리 Settings → Secrets and variables → Actions 에 등록:
#   NAVER_CLIENT_ID / NAVER_CLIENT_SECRET  (네이버 뉴스·DataLab·쇼핑인사이트)
#   ECOS_KEY                               (한국은행)
#   PUBLIC_KEY                             (data.go.kr 공공데이터)
#   GEMINI_KEY                             (선택 — TRACK B 사전수집 시 업체명 추출 품질 향상)
#   RETAIL_FEEDS                           (선택 — Layer1 글로벌 선행시장 '공식 상품피드')
#     └ Sephora·Ulta·@cosme는 직접 스크래핑이 이용약관·봇차단으로 불가하다.
#       제휴/승인을 받으면 아래 형식으로 피드 URL만 등록하면 즉시 실측 전환된다:
#       [{"platform":"Sephora","url":"https://<Rakuten Advertising 제휴 피드 URL>"},
#        {"platform":"Ulta","url":"https://<Impact 제휴 피드 URL>"}]
#       미등록 시에는 각 플랫폼을 '다루는' 공개 뉴스 RSS로 대리 신호만 생성한다
#       (플랫폼 서버에 접근하지 않으므로 정책 위반 없음).
# 미등록 시 키 없이 수집 가능한 범위(Open-Meteo·뷰티 RSS)만 채워진다.
#
# 네이버 키가 있으면 대표 카테고리에 대해 TRACK B(신규 제조처) 후보도 함께 사전수집해
# data/trackb-fallback.json으로 커밋한다 — 브라우저의 CORS 프록시 탐색이 빈약할 때의 백업 데이터.
name: Collect trend data

on:
  schedule:
    - cron: '0 21,3,9,15 * * *'   # UTC 기준 — KST 06시·12시·18시·24시
  workflow_dispatch:               # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: collect-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul               # 날짜 계산(조회 기간 등)을 한국시간 기준으로
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run collector
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          RETAIL_FEEDS: ${{ secrets.RETAIL_FEEDS }}
        run: node scripts/collect-data.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json data/trackb-fallback.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 트렌드 데이터 자동 수집 ($(date '+%Y-%m-%d %H:%M %Z'))"
          git push
