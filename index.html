<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAB05 · AI 전략 분석 — CosmeDB</title>
<style>
:root{
  --navy:#1a2440;--acc:#e8622e;--cyn:#0891b2;--grn:#10b981;
  --red:#ef4444;--yel:#f59e0b;--pur:#8b5cf6;
  --s1:#f8f8f6;--s2:#efefec;--bd:rgba(0,0,0,.1);--bd2:rgba(0,0,0,.18);
  --txt:#1a1917;--txt2:#5c5a56;--txt3:#9b9892;
  --r:6px;--shadow:0 1px 4px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.07);
  --shadow-h:0 3px 12px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--txt);background:var(--s1);padding:12px 14px}
.wrap{max-width:1440px;margin:0 auto}

/* ── 헤더 ── */
.hd{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#fff;border-radius:var(--r);border:.5px solid var(--bd);margin-bottom:10px;box-shadow:var(--shadow);gap:8px;flex-wrap:wrap}
.hd-left{display:flex;align-items:center;gap:8px}
.hd-title{font-size:14px;font-weight:700;color:var(--navy)}
.ai-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;letter-spacing:.06em}
.hd-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ptab-wrap{display:flex;gap:2px;background:var(--s2);border-radius:4px;padding:2px}
.ptab{font-size:11px;padding:3px 11px;border-radius:3px;border:none;cursor:pointer;color:var(--txt2);background:transparent;font-family:inherit;transition:all .12s}
.ptab.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.update-lbl{font-size:10px;color:var(--txt3)}
.btn-rerun{font-size:10px;padding:4px 11px;border-radius:var(--r);border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.btn-rerun:hover{opacity:.82}

/* ── AI 브리핑 ── */
.brief-wrap{margin-bottom:10px;border-radius:var(--r);background:linear-gradient(135deg,#1a2440 0%,#111827 100%);overflow:hidden;box-shadow:0 4px 20px rgba(26,36,64,.3);position:relative}
.brief-wrap::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.18) 0%,transparent 70%);pointer-events:none}
.brief-inner{padding:13px 18px;position:relative;z-index:1}
.brief-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.brief-label::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#6ee7b7;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.brief-text{font-size:12.5px;color:rgba(255,255,255,.88);line-height:1.7;margin-bottom:9px}
.brief-text strong{color:#fff}
.brief-pills{display:flex;gap:5px;flex-wrap:wrap}
.bpill{font-size:9px;padding:2px 8px;border-radius:20px;border:.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.75);background:rgba(255,255,255,.06)}
.bpill.hot{border-color:rgba(249,115,22,.5);color:#fdba74;background:rgba(249,115,22,.1)}
.bpill.oem{border-color:rgba(16,185,129,.45);color:#6ee7b7;background:rgba(16,185,129,.09)}
.bpill.warn{border-color:rgba(245,158,11,.45);color:#fcd34d;background:rgba(245,158,11,.09)}
.bpill.info{border-color:rgba(96,165,250,.45);color:#93c5fd;background:rgba(96,165,250,.09)}

/* ── 2열 메인 레이아웃 ── */
.main-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
@media(max-width:900px){.main-2col{grid-template-columns:1fr}}

/* ── 섹션 공통 ── */
.section-wrap{background:#fff;border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.section-hd{padding:9px 14px;border-bottom:.5px solid var(--bd);background:var(--s2);display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:12px;font-weight:700;color:var(--navy)}
.section-meta{font-size:9px;color:var(--txt3)}

/* ── 최다 추천 OEM 배너 ── */
.top-rec-banner{padding:10px 12px;border-bottom:.5px solid var(--bd);background:linear-gradient(to right,#f0f9ff,#f0fdf4)}
.top-rec-label{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.top-rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.top-rec-card{background:#fff;border:.5px solid var(--bd);border-radius:5px;padding:8px 10px;cursor:pointer;transition:all .12s}
.top-rec-card:hover{box-shadow:var(--shadow-h);border-color:#0891b2}
.trc-rank{font-size:8px;font-weight:700;color:var(--txt3);margin-bottom:3px}
.trc-name{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trc-row{display:flex;align-items:center;justify-content:space-between;gap:4px;flex-wrap:wrap}
.trc-score{font-size:13px;font-weight:800;color:#10b981}
.trc-trade{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#eff6ff;color:#1d4ed8;border:.5px solid #bfdbfe}
.trc-count{font-size:9px;color:var(--txt3);margin-top:3px}
.trc-certs{display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}

/* ── 더보기 버튼 ── */
.more-btn-wrap{padding:10px 12px;border-top:.5px solid var(--bd);text-align:center}
.more-btn{font-size:11px;padding:6px 20px;border-radius:var(--r);border:.5px solid var(--bd);background:var(--s1);color:var(--txt2);cursor:pointer;font-family:inherit;font-weight:500;width:100%;transition:all .12s}
.more-btn:hover{background:var(--s2);color:var(--navy)}
.more-btn:disabled{opacity:.4;cursor:default}

/* ══════════════════════════════════
   트렌드 카드
══════════════════════════════════ */
.t-item{border-bottom:.5px solid var(--bd)}
.t-item:last-child{border-bottom:none}

.t-head{display:flex;gap:8px;align-items:flex-start;padding:9px 12px 7px}
.rank-badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.rb-gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.rb-silver{background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff}
.rb-bronze{background:linear-gradient(135deg,#b45309,#92400e);color:#fff}
.rb-top10{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff}
.rb-rest{background:var(--s2);color:var(--txt3)}

.t-info{flex:1;min-width:0}
.t-name-row{display:flex;align-items:center;gap:4px;margin-bottom:3px;flex-wrap:wrap}
.t-name{font-size:12px;font-weight:700;color:var(--txt)}
.no-type{font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;background:#fff1f2;border:.5px solid #fecdd3;color:#be123c;white-space:nowrap}
.t-tags{display:flex;gap:2px;flex-wrap:wrap}
.tag{font-size:8px;padding:1px 4px;border-radius:3px}
.tag-cat{background:#dbeafe;color:#1e40af}
.tag-func{background:#d1fae5;color:#065f46}
.tag-ingr{background:#ede9fe;color:#5b21b6}

.t-metrics{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.growth-big{font-size:15px;font-weight:800;color:var(--acc);line-height:1}
.growth-lbl{font-size:8px;color:var(--txt3);text-align:right}
.conf-row{display:flex;align-items:center;gap:3px}
.conf-bg{width:40px;height:4px;background:var(--s2);border-radius:2px;overflow:hidden}
.conf-fill{height:100%;border-radius:2px}
.conf-num{font-size:9px;font-weight:600;color:var(--txt2)}
.opp-wrap{display:flex;align-items:baseline;gap:2px;justify-content:flex-end}
.opp-num{font-size:14px;font-weight:800}
.opp-lbl{font-size:8px;color:var(--txt3)}

/* OEM 미리보기 행 */
.t-oem-bar{padding:5px 12px 6px;border-top:.5px solid var(--bd);background:#f9fafc;display:flex;gap:5px;flex-wrap:wrap}
.t-oem-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:.5px solid var(--bd);border-radius:4px;background:#fff;cursor:pointer;font-size:10px;transition:all .12s;max-width:calc(50% - 4px)}
.t-oem-chip:hover{border-color:var(--navy);background:#f0f4ff}
.oc-name{font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.oc-score{font-weight:700;flex-shrink:0}
.oc-trade{font-size:8px;padding:1px 3px;border-radius:2px;flex-shrink:0}
.oc-trade.shadow{background:#eff6ff;color:#1d4ed8}
.oc-trade.confirmed{background:#d1fae5;color:#065f46}

/* 간략 근거 + 펼침 */
.t-brief{padding:6px 12px;border-top:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;transition:background .1s}
.t-brief:hover{background:var(--s1)}
.t-brief-txt{font-size:10px;color:var(--txt2);line-height:1.4;flex:1}
.t-brief-txt b{color:var(--txt)}
.expand-arrow{font-size:9px;color:var(--txt3);flex-shrink:0;transition:transform .2s;user-select:none}
.expand-arrow.open{transform:rotate(180deg)}

/* 트렌드 상세 */
.t-detail{padding:10px 12px;background:#f4f7ff;border-top:.5px solid var(--bd);display:none;animation:fd .15s ease}
.t-detail.open{display:block}
@keyframes fd{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.detail-lbl{font-size:8px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.score-5row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:10px}
.s5-item{text-align:center}
.s5-name{font-size:8px;color:var(--txt3);margin-bottom:2px}
.s5-donut{position:relative;width:34px;height:34px;margin:0 auto 2px}
.s5-svg{width:34px;height:34px;transform:rotate(-90deg)}
.s5-bg{fill:none;stroke:var(--s2);stroke-width:4}
.s5-fg{fill:none;stroke-width:4;stroke-linecap:round}
.s5-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.s5-max{font-size:7px;color:var(--txt3)}
.reason-list{list-style:none;display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.reason-item{display:flex;gap:5px;font-size:10px;color:var(--txt);line-height:1.5}
.risk-box{padding:6px 9px;border-radius:4px;font-size:10px;line-height:1.5;margin-bottom:8px}
.risk-med{background:#fffbf0;border:.5px solid #fde68a;color:#713f12}
.risk-low{background:#f0fdf4;border:.5px solid #a7f3d0;color:#065f46}
.risk-high{background:#fff1f2;border:.5px solid #fecdd3;color:#9f1239}
.src-row{display:flex;gap:3px;flex-wrap:wrap}
.src-tag{font-size:8px;padding:1px 5px;border-radius:3px;background:#e0f2fe;color:#0369a1}
/* 출처 표시줄 */
.t-src-bar{padding:2px 12px 4px;display:flex;align-items:center;gap:3px;flex-wrap:wrap;background:var(--s1);border-top:.5px solid var(--bd)}
.t-src-lbl{font-size:8px;color:var(--txt3);flex-shrink:0}
.src-tag-bn{font-size:8px;padding:1px 5px;border-radius:3px;background:#fdf4ff;color:#7e22ce;border:.5px solid #e9d5ff}
.o-src-note{font-size:8px;color:var(--txt3);padding:3px 12px 5px;border-top:.5px solid var(--bd)}

/* ══════════════════════════════════
   OEM 카드
══════════════════════════════════ */
.o-item{border-bottom:.5px solid var(--bd)}
.o-item:last-child{border-bottom:none}

.o-head{display:flex;gap:8px;align-items:flex-start;padding:9px 12px 7px}
.o-info{flex:1;min-width:0}
.o-name-row{display:flex;align-items:center;gap:5px;margin-bottom:2px;flex-wrap:wrap}
.o-name{font-size:12px;font-weight:700;color:var(--txt)}
.trade-big{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px}
.trade-big.shadow{background:#eff6ff;color:#1d4ed8;border:.5px solid #bfdbfe}
.trade-big.confirmed{background:#f0fdf4;color:#15803d;border:.5px solid #bbf7d0}
.o-region{font-size:9px;color:var(--txt3);margin-bottom:5px}
.o-cert-row{display:flex;gap:2px;flex-wrap:wrap}
.cp{font-size:8px;padding:1px 4px;border-radius:3px;font-weight:600}
.cp-cgmp{background:#fee2e2;color:#991b1b}
.cp-iso{background:#dbeafe;color:#1e40af}
.cp-vegan{background:#d1fae5;color:#065f46}
.cp-halal{background:#fef3c7;color:#92400e}
.cp-otc{background:#ede9fe;color:#5b21b6}
.cp-na{background:var(--s2);color:var(--txt3)}

.o-score-block{flex-shrink:0;text-align:right;min-width:50px}
.hs-num{font-size:22px;font-weight:800;line-height:1}
.hs-lbl{font-size:8px;color:var(--txt3)}

/* 발굴 사유 */
.o-reasons{padding:6px 12px 7px;border-top:.5px solid var(--bd);background:#f9fafc;display:flex;flex-direction:column;gap:3px}
.o-reason{display:flex;gap:5px;font-size:10px;color:var(--txt);line-height:1.5}

/* 확장 버튼 */
.o-expand-btn{padding:7px 12px;border-top:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .1s}
.o-expand-btn:hover{background:var(--s1)}
.o-expand-lbl{font-size:10px;color:var(--cyn)}

/* OEM 확장 상세 */
.o-detail{padding:10px 12px;background:#f4f7ff;border-top:.5px solid var(--bd);display:none;animation:fd .15s ease}
.o-detail.open{display:block}
.growth-stage-box{display:flex;align-items:center;gap:8px;background:#fff;border:.5px solid var(--bd);border-radius:4px;padding:7px 10px;margin-bottom:8px}
.gs-block{flex:1;text-align:center}
.gs-label{font-size:8px;color:var(--txt3);margin-bottom:2px}
.gs-val{font-size:10px;font-weight:600;color:var(--navy)}
.gs-arrow{font-size:16px;color:var(--cyn);flex-shrink:0}
.rec-cat-list{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.rec-cat{font-size:9px;padding:2px 7px;border-radius:3px;background:#dbeafe;color:#1e40af;font-weight:500}
.btn-db-det{font-size:10px;padding:3px 9px;border-radius:4px;border:.5px solid var(--bd);background:#fff;color:var(--txt);cursor:pointer;font-family:inherit}
.btn-db-det:hover{background:var(--s2)}

.bottom-pad{height:24px}
</style>
</head>
<body>
<div class="wrap">

<!-- ══ 헤더 ══ -->
<div class="hd">
  <div class="hd-left">
    <div class="hd-title">AI 전략 분석</div>
    <span class="ai-badge">AI POWERED</span>
  </div>
  <div class="hd-right">
    <span class="update-lbl" id="updateLbl"></span>
    <span class="update-lbl" style="color:var(--txt3);border-left:.5px solid var(--bd);padding-left:8px">출처: 뷰티누리 · 네이버DataLab · 화해 · TikTok · 식약처</span>
    <div class="ptab-wrap" id="periodTabs">
      <button class="ptab" onclick="setPeriod('1m',this)">1개월</button>
      <button class="ptab on" onclick="setPeriod('6m',this)">6개월</button>
      <button class="ptab" onclick="setPeriod('1y',this)">1년</button>
    </div>
    <button class="btn-rerun" onclick="rerunAnalysis()">↺ 재분석</button>
  </div>
</div>

<!-- ══ AI 전략 브리핑 ══ -->
<div class="brief-wrap">
  <div class="brief-inner">
    <div class="brief-label">AI 전략 브리핑</div>
    <div class="brief-text" id="briefText"></div>
    <div class="brief-pills" id="briefPills"></div>
  </div>
</div>

<!-- ══ 2열 메인 ══ -->
<div class="main-2col">

  <!-- 왼쪽: AI 트렌드 예측 -->
  <div class="section-wrap">
    <div class="section-hd">
      <span class="section-title">📈 AI 화장품 트렌드 예측</span>
      <span class="section-meta" id="trendMeta"></span>
    </div>
    <!-- 최다 추천 OEM 배너 -->
    <div class="top-rec-banner">
      <div class="top-rec-label">🏆 트렌드 전반 최다 추천 OEM</div>
      <div class="top-rec-grid" id="topRecGrid"></div>
    </div>
    <!-- 트렌드 리스트 -->
    <div id="trendList"></div>
    <div class="more-btn-wrap" id="trendMoreWrap">
      <button class="more-btn" onclick="showMoreTrend(this)">+ 10개 더 보기 (11~20위)</button>
    </div>
  </div>

  <!-- 오른쪽: Hidden OEM -->
  <div class="section-wrap">
    <div class="section-hd">
      <span class="section-title">🏭 AI Hidden OEM 발굴</span>
      <span class="section-meta" id="oemMeta"></span>
    </div>
    <div id="oemList"></div>
    <div class="more-btn-wrap" id="oemMoreWrap">
      <button class="more-btn" onclick="showMoreOem(this)">+ 10개 더 보기 (11~20위)</button>
    </div>
  </div>

</div><!-- /main-2col -->

<div class="bottom-pad"></div>
</div>

/* ══ OEM 점수 ══ */
function scoreOEM(c) {
  const certs=c.certs||[], ind=(c.industry||'').toLowerCase();
  const isCosm=ind.includes('화장품')||ind.includes('제조');
  let prod=0,tech=0,growth=0,expo=0,attr=0;
  if(certs.includes('CGMP')) prod+=10;
  if(certs.some(x=>x.includes('ISO22716'))) prod+=8;
  if(isCosm) prod+=2;
  prod=Math.min(prod,20);
  if(certs.includes('ISO9001'))  tech+=5;
  if(certs.includes('ISO14001')) tech+=4;
  if(certs.includes('ISO45001')) tech+=3;
  if(certs.includes('ISO13485')) tech+=5;
  if(certs.length>=5) tech+=3;
  if(certs.length>=7) tech+=2;
  tech=Math.min(tech,20);
  if(c.status==='SHADOW') growth+=8;
  if(certs.length>=3) growth+=5;
  if(['세종','충청'].includes(c.region)) growth+=3;
  else if(['인천','경기'].includes(c.region)) growth+=2;
  growth+=Math.min(Math.floor(certs.length*.6),4);
  growth=Math.min(Math.round(growth),20);
  if(certs.includes('할랄')) expo+=12;
  if(certs.includes('비건')) expo+=8;
  if(certs.includes('OTC DRUG')) expo+=5;
  expo=Math.min(expo,20);
  if(c.status==='SHADOW') attr+=10;
  if(prod>=16) attr+=6; else if(prod>=8) attr+=3;
  if(isCosm) attr+=4;
  attr=Math.min(attr,20);
  return {...c,s:{prod,tech,growth,expo,attr},total:prod+tech+growth+expo+attr};
}

let _cachedOem=null;
function getOemScores(){
  if(!_cachedOem){
    const f=DB_REAL.filter(c=>{
      const certs=c.certs||[], ind=(c.industry||'').toLowerCase();
      const hasCert=certs.some(x=>['CGMP','비건','할랄','OTC DRUG'].includes(x)||x.includes('ISO22716'));
      const isMfg=ind.includes('화장품')||ind.includes('제조');
      return (hasCert||isMfg)&&!ind.includes('용기')&&!(ind.includes('플라스틱')&&!hasCert);
    });
    _cachedOem=f.map(scoreOEM).sort((a,b)=>b.total-a.total);
  }
  return _cachedOem;
}

function buildOemReasons(c){
  const certs=c.certs||[], r=[];
  if(certs.includes('CGMP')&&certs.some(x=>x.includes('ISO22716')))
    r.push({icon:'✅',txt:'CGMP + ISO22716 보유 — GMP 기반 국제 기준 생산'});
  else if(certs.includes('CGMP')) r.push({icon:'✅',txt:'CGMP 인증 — GMP 기반 고품질 생산'});
  else if(certs.some(x=>x.includes('ISO22716'))) r.push({icon:'✅',txt:'ISO22716 — 국제 기준 화장품 GMP'});
  if(certs.includes('할랄')) r.push({icon:'🌍',txt:'할랄 인증 — 중동·동남아 즉시 수출 가능'});
  if(certs.includes('비건')) r.push({icon:'🌿',txt:'비건 인증 — 글로벌 클린뷰티 대응'});
  if(c.status==='SHADOW') r.push({icon:'💡',txt:'미거래 상태 — 독점 거래선 선점 기회'});
  if(certs.length>=5) r.push({icon:'🏆',txt:`인증 ${certs.length}개 — 체계적 품질·환경 관리`});
  if(['세종','충청'].includes(c.region)) r.push({icon:'🏭',txt:'세종/충청 산단 — 생산비용 경쟁력'});
  return r.slice(0,3);
}

function buildOemCats(c){
  const certs=c.certs||[], ind=(c.industry||'').toLowerCase(), cats=[];
  if(ind.includes('화장품')||certs.some(x=>x.includes('ISO22716'))) cats.push('스킨케어');
  if(certs.some(x=>x.includes('ISO22716'))) cats.push('마스크팩');
  if(certs.includes('CGMP')) cats.push('앰플/세럼');
  if(certs.includes('할랄')) cats.push('할랄 화장품');
  if(certs.includes('비건')) cats.push('비건 화장품');
  return [...new Set(cats)].slice(0,4);
}

function getGrowthStage(t){
  if(t>=85) return {now:'중소 OEM',pred:'중견 OEM 진입',period:'1~2년'};
  if(t>=70) return {now:'중소 OEM',pred:'중견 준비',period:'2년'};
  if(t>=55) return {now:'소규모 OEM',pred:'중소 OEM',period:'2~3년'};
  return          {now:'소규모 OEM',pred:'안정 성장',period:'3년'};
}

/* ══ 유틸 ══ */
function oppColor(s){return s>=75?'#10b981':s>=58?'#f59e0b':'#ef4444'}
function barColor(v,m){return v/m>=.75?'#10b981':v/m>=.5?'#f59e0b':'#ef4444'}
function certClass(c){
  if(c.includes('CGMP')) return 'cp-cgmp';
  if(c.includes('ISO')) return 'cp-iso';
  if(c==='비건') return 'cp-vegan';
  if(c==='할랄') return 'cp-halal';
  if(c.includes('OTC')) return 'cp-otc';
  return 'cp-na';
}
function rbClass(r){return r===1?'rb-gold':r===2?'rb-silver':r===3?'rb-bronze':r<=10?'rb-top10':'rb-rest'}
function donutSVG(v,m,col){
  const r=14,c=2*Math.PI*r,p=Math.min(v/m,1);
  return `<svg class="s5-svg" viewBox="0 0 34 34"><circle class="s5-bg" cx="17" cy="17" r="${r}"/><circle class="s5-fg" cx="17" cy="17" r="${r}" stroke="${col}" stroke-dasharray="${(p*c).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}

function getTopRecOems(){
  const cnt={};
  TREND_BASE.forEach(t=>(t.recIds||[]).forEach(id=>{cnt[id]=(cnt[id]||0)+1}));
  const oemScored=getOemScores();
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([id,count])=>{
    const o=oemScored.find(x=>x.id==id);
    return o?{...o,recCount:count}:null;
  }).filter(Boolean);
}

    const certsHtml=keyCerts.map(c=>`<span class="cp ${certClass(c)}">${c}</span>`).join('');
    return `<div class="top-rec-card" onclick="goToDbDetail(${o.id})">
      <div class="trc-rank">${i===0?'🥇 1순위':'🥈 2순위'} 최다 추천</div>
      <div class="trc-name">${o.name}</div>
      <div class="trc-row">
        <span class="trc-score" style="color:${sc}">${o.total}점</span>
        <span class="trc-trade">${o.status==='SHADOW'?'미거래 ★':'거래 중 ✓'}</span>
      </div>
      <div class="trc-count">${o.region} · 전체 트렌드 중 <strong>${o.recCount}회</strong> 추천</div>
      <div class="trc-certs">${certsHtml}</div>
    </div>`;
  }).join('');
  document.getElementById('topRecGrid').innerHTML=html;
}

/* ══ 트렌드 렌더 ══ */
function renderTrends(){
  const cfg=PERIOD_CFG[currentPeriod];
  document.getElementById('trendMeta').textContent=cfg.label+' · TOP '+TREND_BASE.length;
  const oemScored=getOemScores();
  const items=TREND_BASE.slice(0,trendShown);

  const html=items.map((t,idx)=>{
    const rank=idx+1;
    const g=Math.round(t.growth*cfg.growthMul);
    const conf=Math.min(cfg.confCap,Math.max(45,t.conf+cfg.confAdd));
    const opp=t.scores.market+t.scores.growth+t.scores.comp+t.scores.prod+t.scores.reg;
    const oc=oppColor(opp);
    const cc=conf>=85?'#10b981':conf>=70?'#f59e0b':'#ef4444';
    const noType=!PORTFOLIO_TYPES.has(t.cat);

    const oemChips=(t.recIds||[]).slice(0,2).map(id=>{
      const o=oemScored.find(x=>x.id===id);
      if(!o) return '';
      const sc2=o.total>=75?'#10b981':'#f59e0b';
      const tradeCls=o.status==='SHADOW'?'shadow':'confirmed';
      const tradeTxt=o.status==='SHADOW'?'미거래★':'거래중';
      return `<div class="t-oem-chip" onclick="goToDbDetail(${o.id})">
        <span class="oc-name">${o.name}</span>
        <span class="oc-score" style="color:${sc2}">${o.total}점</span>
        <span class="oc-trade ${tradeCls}">${tradeTxt}</span>
      </div>`;
    }).join('');

    const reasHtml=t.reasons.map(r=>`<li class="reason-item"><span>${r.icon}</span>${r.txt}</li>`).join('');
    const riskCls=t.risk.level==='low'?'risk-low':t.risk.level==='high'?'risk-high':'risk-med';
    const sItems=[{name:'시장성',v:t.scores.market,m:25},{name:'성장성',v:t.scores.growth,m:30},{name:'경쟁강도',v:t.scores.comp,m:15},{name:'생산용이',v:t.scores.prod,m:15},{name:'규제안전',v:t.scores.reg,m:15}];
    const s5Html=sItems.map(si=>{
      const sc3=barColor(si.v,si.m);
      return `<div class="s5-item"><div class="s5-name">${si.name}</div><div class="s5-donut">${donutSVG(si.v,si.m,sc3)}<div class="s5-num" style="color:${sc3}">${si.v}</div></div><div class="s5-max">/${si.m}</div></div>`;
    }).join('');
    const srcs=t.sources||[];
    const srcBarHtml=srcs.map(s=>s==='뷰티누리'?`<span class="src-tag-bn">뷰티누리</span>`:`<span class="src-tag">${s}</span>`).join('');
    const srcHtml=srcs.map(s=>s==='뷰티누리'?`<span class="src-tag-bn">뷰티누리</span>`:`<span class="src-tag">${s}</span>`).join('');

    return `<div class="t-item">
      <div class="t-head">
        <div class="rank-badge ${rbClass(rank)}">${rank}</div>
        <div class="t-info">
          <div class="t-name-row">
            <span class="t-name">${t.name}</span>
            ${noType?'<span class="no-type">미보유 유형</span>':''}
          </div>
          <div class="t-tags">
            <span class="tag tag-cat">${t.cat}</span>
            <span class="tag tag-func">${t.func}</span>
            <span class="tag tag-ingr">${t.ingr}</span>
          </div>
        </div>
        <div class="t-metrics">
          <div><div class="growth-big">+${g}%</div><div class="growth-lbl">예상성장률</div></div>
          <div>
            <div class="conf-row"><div class="conf-bg"><div class="conf-fill" style="width:${conf}%;background:${cc}"></div></div><span class="conf-num">${conf}%</span></div>
            <div class="growth-lbl">신뢰도</div>
          </div>
          <div><div class="opp-wrap"><span class="opp-num" style="color:${oc}">${opp}</span><span class="opp-lbl">/100</span></div><div class="growth-lbl">기회점수</div></div>
        </div>
      </div>
      <div class="t-oem-bar">${oemChips||'<span style="font-size:9px;color:var(--txt3)">추천 OEM 연동 예정</span>'}</div>
      ${srcs.length?`<div class="t-src-bar"><span class="t-src-lbl">📊 출처</span>${srcBarHtml}</div>`:''}
      <div class="t-brief" onclick="toggleT(${t.id})">
        <span class="t-brief-txt"><b>💡</b> ${t.briefReason}</span>
        <span class="expand-arrow" id="ta-${t.id}">▼</span>
      </div>
      <div class="t-detail" id="td-${t.id}">
        <div class="detail-lbl" style="margin-bottom:5px">점수 구성 (합계 ${opp}/100)</div>
        <div class="score-5row">${s5Html}</div>
        <div class="detail-lbl" style="margin-bottom:4px">AI 분석 근거</div>
        <ul class="reason-list">${reasHtml}</ul>
        <div class="detail-lbl" style="margin-bottom:4px">리스크 평가</div>
        <div class="risk-box ${riskCls}" style="margin-bottom:8px">${t.risk.txt}</div>
        <div class="detail-lbl" style="margin-bottom:4px">데이터 소스</div>
        <div class="src-row">${srcHtml}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('trendList').innerHTML=html;
  const wrap=document.getElementById('trendMoreWrap');
  if(trendShown>=TREND_BASE.length) wrap.style.display='none';
  else{ wrap.style.display=''; wrap.querySelector('button').disabled=false; }
}

/* ══ OEM 렌더 ══ */
function renderOEMs(){
  const scored=getOemScores();
  document.getElementById('oemMeta').textContent=`DB 중 상위 ${Math.min(oemShown,scored.length)}/${scored.length}개`;
  const items=scored.slice(0,oemShown);

  const html=items.map((c,idx)=>{
    const rank=idx+1;
    const sc=c.total>=75?'#10b981':c.total>=55?'#f59e0b':'#ef4444';
    const tradeCls=c.status==='SHADOW'?'shadow':'confirmed';
    const tradeLbl=c.status==='SHADOW'?'미거래 ★':'거래 중 ✓';
    const certHtml=(c.certs||[]).slice(0,6).map(cert=>`<span class="cp ${certClass(cert)}">${cert}</span>`).join('');
    const reasons=buildOemReasons(c);
    const reasHtml=reasons.map(r=>`<div class="o-reason"><span>${r.icon}</span>${r.txt}</div>`).join('');
    const cats=buildOemCats(c);
    const catsHtml=cats.map(cat=>`<span class="rec-cat">${cat}</span>`).join('');
    const stage=getGrowthStage(c.total);
    const sItems=[{name:'생산력',v:c.s.prod,m:20},{name:'기술력',v:c.s.tech,m:20},{name:'성장성',v:c.s.growth,m:20},{name:'수출역량',v:c.s.expo,m:20},{name:'거래매력',v:c.s.attr,m:20}];
    const s5Html=sItems.map(si=>{
      const sc3=barColor(si.v,si.m);
      return `<div class="s5-item"><div class="s5-name">${si.name}</div><div class="s5-donut">${donutSVG(si.v,si.m,sc3)}<div class="s5-num" style="color:${sc3}">${si.v}</div></div><div class="s5-max">/${si.m}</div></div>`;
    }).join('');

    return `<div class="o-item">
      <div class="o-head">
        <div class="rank-badge ${rbClass(rank)}">${rank}</div>
        <div class="o-info">
          <div class="o-name-row">
            <span class="o-name">${c.name}</span>
            <span class="trade-big ${tradeCls}">${tradeLbl}</span>
          </div>
          <div class="o-region">${c.region} · ${c.code}</div>
          <div class="o-cert-row">${certHtml||'<span class="cp cp-na">인증없음</span>'}</div>
        </div>
        <div class="o-score-block">
          <div class="hs-num" style="color:${sc}">${c.total}</div>
          <div class="hs-lbl">/ 100</div>
        </div>
      </div>
      <div class="o-reasons">${reasHtml}</div>
      <div class="o-src-note">📊 출처: CosmeDB 내부 DB · 인증/지역 데이터 기반 AI 스코어링</div>
      <div class="o-expand-btn" onclick="toggleO(${c.id})">
        <span class="o-expand-lbl">점수 상세 · 성장단계 · 추천 분야</span>
        <span class="expand-arrow" id="oa-${c.id}">▼</span>
      </div>
      <div class="o-detail" id="od-${c.id}">
        <div class="growth-stage-box">
          <div class="gs-block"><div class="gs-label">현재</div><div class="gs-val">${stage.now}</div></div>
          <div class="gs-arrow">→</div>
          <div class="gs-block"><div class="gs-label">예상 (${stage.period})</div><div class="gs-val" style="color:var(--cyn)">${stage.pred}</div></div>
        </div>
        <div class="detail-lbl" style="margin-bottom:5px">점수 구성</div>
        <div class="score-5row" style="margin-bottom:9px">${s5Html}</div>
        <div class="detail-lbl" style="margin-bottom:5px">추천 생산 분야</div>
        <div class="rec-cat-list" style="margin-bottom:9px">${catsHtml||'<span style="font-size:10px;color:var(--txt3)">분류 데이터 부족</span>'}</div>
        <button class="btn-db-det" onclick="goToDbDetail(${c.id})">TAB02 상세 보기 →</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('oemList').innerHTML=html;
  const wrap=document.getElementById('oemMoreWrap');
  if(oemShown>=scored.length||oemShown>=20) wrap.style.display='none';
  else{ wrap.style.display=''; wrap.querySelector('button').disabled=false; }
}

/* ══ 더보기 ══ */
function showMoreTrend(btn){
  btn.textContent='로딩 중…'; btn.disabled=true;
  trendShown=Math.min(trendShown+10,TREND_BASE.length);
  setTimeout(renderTrends,100);
}
function showMoreOem(btn){
  btn.textContent='로딩 중…'; btn.disabled=true;
  oemShown=Math.min(oemShown+10,20);
  setTimeout(renderOEMs,100);
}

/* ══ 토글 ══ */
function toggleT(id){
  const d=document.getElementById('td-'+id),a=document.getElementById('ta-'+id);
  const o=d.classList.contains('open');
  d.classList.toggle('open',!o); a&&a.classList.toggle('open',!o);
}
function toggleO(id){
  const d=document.getElementById('od-'+id),a=document.getElementById('oa-'+id);
  const o=d.classList.contains('open');
  d.classList.toggle('open',!o); a&&a.classList.toggle('open',!o);
}

/* ══ 기간 탭 ══ */
function setPeriod(p,el){
  currentPeriod=p; trendShown=10; oemShown=10;
  document.querySelectorAll('#periodTabs .ptab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderBrief(); renderTrends(); renderOEMs();
}

/* ══ 재분석 ══ */
function rerunAnalysis(){
  const btn=document.querySelector('.btn-rerun');
  btn.textContent='분석 중…'; btn.disabled=true;
  _cachedOem=null; trendShown=10; oemShown=10;
  setTimeout(()=>{
    renderAll();
    btn.textContent='↺ 재분석'; btn.disabled=false;
    document.getElementById('updateLbl').textContent='업데이트: '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  },600);
}

/* ══ DB 스텁 ══ */
function goToDbDetail(id){
  const c=DB_REAL.find(d=>d.id===id);
  if(!c) return;
  alert(`[TAB02 연동] ${c.name}\n지역: ${c.region}\n인증: ${(c.certs||[]).join(', ')||'없음'}\n\n(탭 통합 후 실제 상세 페이지로 이동)`);
}

/* ══ 전체 렌더 ══ */
function renderAll(){renderBrief();renderTopRec();renderTrends();renderOEMs();}

document.getElementById('updateLbl').textContent='업데이트: '+new Date().toLocaleDateString('ko-KR');
renderAll();
</script>
</body>
</html>
