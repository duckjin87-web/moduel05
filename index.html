<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAB05 · AI 전략 분석 — CosmeDB</title>
<style>
:root{
  --navy:#1a2440;--acc:#e8622e;--cyn:#0891b2;--grn:#10b981;
  --red:#ef4444;--yel:#f59e0b;--pur:#8b5cf6;
  --s1:#f8f8f6;--s2:#efefec;--bd:rgba(0,0,0,.1);--bd2:rgba(0,0,0,.18);
  --txt:#1a1917;--txt2:#5c5a56;--txt3:#9b9892;
  --r:6px;--shadow:0 1px 4px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.07);
  --shadow-h:0 3px 10px rgba(0,0,0,.11),0 0 0 .5px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--txt);background:var(--s1);padding:12px 14px}
.wrap{max-width:1440px;margin:0 auto}

/* ── 헤더 ── */
.hd{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#fff;border-radius:var(--r);border:.5px solid var(--bd);margin-bottom:10px;box-shadow:var(--shadow);gap:8px;flex-wrap:wrap}
.hd-left{display:flex;align-items:center;gap:8px}
.hd-title{font-size:14px;font-weight:700;color:var(--navy)}
.ai-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;letter-spacing:.06em}
.hd-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ptab-wrap{display:flex;gap:2px;background:var(--s2);border-radius:4px;padding:2px}
.ptab{font-size:11px;padding:3px 11px;border-radius:3px;border:none;cursor:pointer;color:var(--txt2);background:transparent;font-family:inherit;transition:all .12s}
.ptab.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.update-lbl{font-size:10px;color:var(--txt3)}
.btn-rerun{font-size:10px;padding:4px 11px;border-radius:var(--r);border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;transition:opacity .12s}
.btn-rerun:hover{opacity:.82}

/* ── AI 브리핑 카드 ── */
.brief-wrap{margin-bottom:12px;border-radius:var(--r);background:linear-gradient(135deg,#1a2440 0%,#111827 100%);overflow:hidden;box-shadow:0 4px 20px rgba(26,36,64,.3);position:relative}
.brief-wrap::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.18) 0%,transparent 70%);pointer-events:none}
.brief-wrap::after{content:'';position:absolute;bottom:-80px;left:20%;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.12) 0%,transparent 70%);pointer-events:none}
.brief-inner{padding:16px 20px;position:relative;z-index:1}
.brief-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.brief-label::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#6ee7b7;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.brief-text{font-size:13px;color:rgba(255,255,255,.88);line-height:1.75;margin-bottom:12px}
.brief-text strong{color:#fff}
.brief-pills{display:flex;gap:6px;flex-wrap:wrap}
.bpill{font-size:10px;padding:3px 10px;border-radius:20px;border:.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.75);background:rgba(255,255,255,.06);cursor:default}
.bpill.hot{border-color:rgba(249,115,22,.5);color:#fdba74;background:rgba(249,115,22,.1)}
.bpill.oem{border-color:rgba(16,185,129,.45);color:#6ee7b7;background:rgba(16,185,129,.09)}
.bpill.warn{border-color:rgba(245,158,11,.45);color:#fcd34d;background:rgba(245,158,11,.09)}
.bpill.info{border-color:rgba(96,165,250,.45);color:#93c5fd;background:rgba(96,165,250,.09)}

/* ── 섹션 공통 ── */
.section-wrap{background:#fff;border:.5px solid var(--bd);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.section-hd{padding:10px 16px;border-bottom:.5px solid var(--bd);background:var(--s2);display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:13px;font-weight:700;color:var(--navy)}
.section-meta{font-size:10px;color:var(--txt3)}

/* ── 트렌드 리스트 ── */
.trend-list{display:flex;flex-direction:column}
.trend-row{border-bottom:.5px solid var(--bd)}
.trend-row:last-child{border-bottom:none}
.trend-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .1s;user-select:none}
.trend-head:hover{background:var(--s1)}
.rank-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.rb-gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.rb-silver{background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff}
.rb-bronze{background:linear-gradient(135deg,#b45309,#92400e);color:#fff}
.rb-top10{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff}
.rb-rest{background:var(--s2);color:var(--txt3)}
.trend-info{flex:1;min-width:0}
.trend-name{font-size:12px;font-weight:600;color:var(--txt);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend-tags{display:flex;gap:3px;flex-wrap:wrap}
.tag{font-size:9px;padding:1px 5px;border-radius:3px}
.tag-cat{background:#dbeafe;color:#1e40af}
.tag-func{background:#d1fae5;color:#065f46}
.tag-ingr{background:#ede9fe;color:#5b21b6}
.trend-metrics{display:flex;align-items:center;gap:12px;flex-shrink:0}
.metric-block{text-align:right}
.metric-val{font-size:13px;font-weight:700}
.metric-lbl{font-size:9px;color:var(--txt3);margin-top:1px}
.growth-val{color:var(--acc)}
.conf-row{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.conf-bg{width:52px;height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.conf-fill{height:100%;border-radius:3px}
.conf-num{font-size:10px;color:var(--txt2);font-weight:600;min-width:28px;text-align:right}
.opp-badge{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-size:12px;font-weight:700;border:2px solid currentColor}
.expand-arrow{font-size:10px;color:var(--txt3);flex-shrink:0;transition:transform .2s;margin-left:4px}
.expand-arrow.open{transform:rotate(180deg)}

/* ── 트렌드 상세 ── */
.trend-detail{padding:12px 14px 14px 50px;background:#f9fafc;border-top:.5px solid var(--bd);display:none;animation:fadeIn .15s ease}
.trend-detail.open{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:700px){.detail-grid{grid-template-columns:1fr}}
.detail-block{}
.detail-lbl{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.score-5grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.s5-item{text-align:center}
.s5-name{font-size:9px;color:var(--txt3);margin-bottom:4px}
.s5-donut{position:relative;width:40px;height:40px;margin:0 auto 3px}
.s5-svg{width:40px;height:40px;transform:rotate(-90deg)}
.s5-bg{fill:none;stroke:var(--s2);stroke-width:4}
.s5-fg{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.s5-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.s5-max{font-size:8px;color:var(--txt3);margin-top:1px}
.reason-list{list-style:none;display:flex;flex-direction:column;gap:5px}
.reason-item{display:flex;gap:6px;font-size:11px;color:var(--txt);line-height:1.5}
.r-icon{flex-shrink:0;font-size:12px}
.risk-box{padding:8px 10px;border-radius:4px;font-size:11px;line-height:1.55}
.risk-med{background:#fffbf0;border:.5px solid #fde68a;color:#713f12}
.risk-low{background:#f0fdf4;border:.5px solid #a7f3d0;color:#065f46}
.risk-high{background:#fff1f2;border:.5px solid #fecdd3;color:#9f1239}
.oem-chips{display:flex;gap:5px;flex-wrap:wrap}
.oem-chip{font-size:10px;padding:3px 8px;border-radius:3px;background:var(--s2);color:var(--txt);border:.5px solid var(--bd);cursor:pointer;transition:all .1s}
.oem-chip:hover{background:var(--navy);color:#fff}
.src-tags{display:flex;gap:4px;flex-wrap:wrap}
.src-tag{font-size:9px;padding:1px 6px;border-radius:3px;background:#e0f2fe;color:#0369a1}

/* ── OEM 리스트 ── */
.oem-list{display:flex;flex-direction:column}
.oem-row{border-bottom:.5px solid var(--bd)}
.oem-row:last-child{border-bottom:none}
.oem-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .1s;user-select:none}
.oem-head:hover{background:var(--s1)}
.oem-info{flex:1;min-width:0}
.oem-name{font-size:12px;font-weight:600;color:var(--txt);margin-bottom:2px}
.oem-sub{font-size:10px;color:var(--txt3);margin-bottom:5px}
.oem-bars{display:flex;flex-direction:column;gap:2px}
.bar-row{display:flex;align-items:center;gap:5px}
.bar-lbl{font-size:8px;color:var(--txt3);width:30px;text-align:right;flex-shrink:0}
.bar-bg{width:80px;height:4px;background:var(--s2);border-radius:2px;overflow:hidden;flex-shrink:0}
.bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.bar-val{font-size:8px;color:var(--txt2);width:20px;flex-shrink:0}
.oem-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.hidden-score{text-align:center}
.hs-num{font-size:22px;font-weight:700}
.hs-lbl{font-size:9px;color:var(--txt3)}
.cert-pills{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:140px}
.cp{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:600}
.cp-cgmp{background:#fee2e2;color:#991b1b}
.cp-iso{background:#dbeafe;color:#1e40af}
.cp-vegan{background:#d1fae5;color:#065f46}
.cp-halal{background:#fef3c7;color:#92400e}
.cp-otc{background:#ede9fe;color:#5b21b6}
.cp-na{background:var(--s2);color:var(--txt3)}

/* ── OEM 상세 ── */
.oem-detail{padding:12px 14px 14px 50px;background:#f9fafc;border-top:.5px solid var(--bd);display:none;animation:fadeIn .15s ease}
.oem-detail.open{display:block}
.growth-stage-box{display:flex;align-items:center;gap:10px;background:#fff;border:.5px solid var(--bd);border-radius:4px;padding:8px 12px;margin-bottom:10px}
.gs-now{font-size:11px;color:var(--txt2);text-align:center;flex:1}
.gs-arrow{font-size:20px;color:var(--cyn);flex-shrink:0}
.gs-pred{font-size:11px;font-weight:600;color:var(--navy);text-align:center;flex:1}
.gs-period{font-size:9px;color:var(--txt3);text-align:center;margin-top:2px}
.rec-cat-list{display:flex;gap:5px;flex-wrap:wrap}
.rec-cat{font-size:10px;padding:3px 9px;border-radius:3px;background:#dbeafe;color:#1e40af;font-weight:500}

/* ── 공통 유틸 ── */
.score-green{color:#10b981}
.score-yellow{color:#f59e0b}
.score-red{color:#ef4444}
.badge{display:inline-block;font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px}
.badge-grn{background:#d1fae5;color:#065f46}
.badge-sky{background:#e0f2fe;color:#0369a1}
.bottom-pad{height:28px}

@media(max-width:900px){.trend-metrics{gap:8px}.bar-bg{width:60px}}
@media(max-width:650px){.trend-detail{padding-left:14px}.oem-detail{padding-left:14px}.score-5grid{grid-template-columns:repeat(5,1fr)}.conf-bg{width:40px}}
</style>
</head>

let currentPeriod = '6m';

/* ════ 기간 multiplier ════ */
const PERIOD_CFG = {
  '1m': {growthMul:0.22, confAdd:5,  label:'1개월 예측',  confCap:97},
  '6m': {growthMul:1.0,  confAdd:0,  label:'6개월 예측',  confCap:97},
  '1y': {growthMul:2.4,  confAdd:-8, label:'1년 예측',    confCap:97},
};

function adjGrowth(base, period) {
  return Math.round(base * PERIOD_CFG[period].growthMul);
}
function adjConf(base, period) {
  return Math.min(PERIOD_CFG[period].confCap, Math.max(45, base + PERIOD_CFG[period].confAdd));
}

/* ════ OEM 점수 산정 ════ */
function scoreOEM(c) {
  const certs = c.certs || [];
  const ind = (c.industry || '').toLowerCase();
  const isCosm = ind.includes('화장품') || ind.includes('제조');

  // [A] 생산력 (20)
  let prod = 0;
  if (certs.includes('CGMP'))    prod += 10;
  if (certs.some(x=>x.includes('ISO22716'))) prod += 8;
  if (isCosm)                    prod += 2;
  prod = Math.min(prod, 20);

  // [B] 기술력 (20)
  let tech = 0;
  if (certs.includes('ISO9001'))  tech += 5;
  if (certs.includes('ISO14001')) tech += 4;
  if (certs.includes('ISO45001')) tech += 3;
  if (certs.includes('ISO13485')) tech += 5;
  if (certs.length >= 5) tech += 3;
  if (certs.length >= 7) tech += 2;
  tech = Math.min(tech, 20);

  // [C] 성장성 (20) — 미거래·충청/세종 산단·인증다양성
  let growth = 0;
  if (c.status === 'SHADOW') growth += 8;
  if (certs.length >= 3)     growth += 5;
  if (['세종','충청'].includes(c.region)) growth += 3;
  else if (['인천','경기'].includes(c.region)) growth += 2;
  growth += Math.min(Math.floor(certs.length * 0.6), 4);
  growth = Math.min(Math.round(growth), 20);

  // [D] 수출역량 (20)
  let expo = 0;
  if (certs.includes('할랄'))   expo += 12;
  if (certs.includes('비건'))   expo += 8;
  if (certs.includes('OTC DRUG')) expo += 5;
  if (certs.includes('ISO13485')) expo += 4;
  expo = Math.min(expo, 20);

  // [E] 거래매력도 (20)
  let attr = 0;
  if (c.status === 'SHADOW') attr += 10;
  if (prod >= 16)            attr += 6;
  else if (prod >= 8)        attr += 3;
  if (isCosm)                attr += 4;
  attr = Math.min(attr, 20);

  const total = prod + tech + growth + expo + attr;
  return { ...c, s: { prod, tech, growth, expo, attr }, total };
}

function buildOemReasons(c) {
  const certs = c.certs || [];
  const r = [];
  if (certs.includes('CGMP'))           r.push({icon:'✅',txt:'CGMP 인증 보유 — GMP 기반 고품질 생산 체계 검증'});
  if (certs.some(x=>x.includes('ISO22716'))) r.push({icon:'✅',txt:'ISO22716 보유 — 국제 기준 화장품 GMP 적용'});
  if (certs.includes('할랄'))           r.push({icon:'🌍',txt:'할랄 인증 — 중동·동남아 시장 즉시 수출 가능 (시장성장률 +51%)'});
  if (certs.includes('비건'))           r.push({icon:'🌿',txt:'비건 인증 — 글로벌 클린뷰티 수요 직접 대응 가능'});
  if (certs.includes('OTC DRUG'))       r.push({icon:'💊',txt:'OTC 의약외품 제조 가능 — 기능성 화장품 고부가가치'});
  if (c.status === 'SHADOW')            r.push({icon:'💡',txt:'현재 미거래 상태 — 독점 거래선 선점 기회'});
  if (certs.length >= 5)               r.push({icon:'🏆',txt:`다중 인증 ${certs.length}개 보유 — 체계적 품질·환경 관리 확인`});
  if (['세종','충청'].includes(c.region)) r.push({icon:'🏭',txt:'세종/충청 산업단지 입지 — 생산비용 경쟁력'});
  if (certs.includes('ISO9001') && certs.includes('ISO14001')) r.push({icon:'📋',txt:'ISO9001+ISO14001 동시 보유 — 품질·환경 이중 관리'});
  return r.slice(0, 5);
}

function buildOemCategories(c) {
  const certs = c.certs || [];
  const cats = [];
  const ind = (c.industry || '').toLowerCase();
  if (ind.includes('화장품') || certs.some(x=>x.includes('ISO22716'))) cats.push('스킨케어');
  if (certs.some(x=>x.includes('ISO22716'))) cats.push('마스크팩');
  if (certs.includes('CGMP')) cats.push('앰플/세럼');
  if (certs.includes('할랄')) cats.push('할랄 화장품');
  if (certs.includes('비건')) cats.push('비건 화장품');
  if (certs.includes('OTC DRUG')) cats.push('기능성 화장품');
  return [...new Set(cats)].slice(0, 4);
}

function getGrowthStage(total) {
  if (total >= 85) return {now:'중소 OEM',pred:'중견 OEM 진입',period:'1~2년'};
  if (total >= 70) return {now:'중소 OEM',pred:'중견 OEM 준비',period:'2년'};
  if (total >= 55) return {now:'소규모 OEM',pred:'중소 OEM 성장',period:'2~3년'};
  return              {now:'소규모 OEM',pred:'안정 중소 OEM',period:'3년'};
}

/* ════ 색상 유틸 ════ */
function oppColor(s) {
  if (s >= 75) return '#10b981';
  if (s >= 58) return '#f59e0b';
  return '#ef4444';
}
function rankBadgeClass(r) {
  if (r === 1) return 'rb-gold';
  if (r === 2) return 'rb-silver';
  if (r === 3) return 'rb-bronze';
  if (r <= 10) return 'rb-top10';
  return 'rb-rest';
}
function barColor(v, max) {
  const pct = v / max;
  if (pct >= 0.75) return '#10b981';
  if (pct >= 0.5)  return '#f59e0b';
  return '#ef4444';
}
function certClass(cert) {
  if (cert.includes('CGMP')) return 'cp-cgmp';
  if (cert.includes('ISO')) return 'cp-iso';
  if (cert === '비건') return 'cp-vegan';
  if (cert === '할랄') return 'cp-halal';
  if (cert.includes('OTC')) return 'cp-otc';
  return 'cp-na';
}

/* ════ 도넛 SVG ════ */
function donutSVG(val, max, color) {
  const r = 15, c = 2*Math.PI*r;
  const pct = Math.min(val/max, 1);
  return `<svg class="s5-svg" viewBox="0 0 40 40">
    <circle class="s5-bg" cx="20" cy="20" r="${r}"/>
    <circle class="s5-fg" cx="20" cy="20" r="${r}"
      stroke="${color}"
      stroke-dasharray="${(pct*c).toFixed(1)} ${c.toFixed(1)}"/>
  </svg>`;
}

          <div class="cert-pills" style="margin-top:5px">${certHtml || '<span class="cp cp-na">인증없음</span>'}</div>
        </div>
        <div class="oem-right">
          <div class="hidden-score">
            <div class="hs-num" style="color:${sc}">${c.total}</div>
            <div class="hs-lbl">Hidden Score</div>
          </div>
        </div>
        <span class="expand-arrow" id="oa-${c.id}">▼</span>
      </div>
      <div class="oem-detail" id="od-${c.id}">
        <div class="growth-stage-box">
          <div>
            <div class="gs-now">${stage.now}</div>
            <div class="gs-period" style="color:var(--txt3)">현재</div>
          </div>
          <div class="gs-arrow">→</div>
          <div>
            <div class="gs-pred">${stage.pred}</div>
            <div class="gs-period">예상 ${stage.period}</div>
          </div>
        </div>
        <div class="detail-grid">
          <div class="detail-block">
            <div class="detail-lbl">점수 구성 (합계 ${c.total}/100)</div>
            <div class="score-5grid">${score5Html}</div>
          </div>
          <div class="detail-block">
            <div class="detail-lbl">발굴 사유</div>
            <ul class="reason-list">${reasonsHtml}</ul>
          </div>
        </div>
        <div style="margin-top:10px">
          <div class="detail-lbl">추천 생산 분야</div>
          <div class="rec-cat-list">${catsHtml || '<span style="font-size:11px;color:var(--txt3)">분류 데이터 부족</span>'}</div>
        </div>
        <div style="margin-top:10px;display:flex;gap:6px">
          <button onclick="goToDbDetail(${c.id})" style="font-size:10px;padding:4px 10px;border-radius:4px;border:.5px solid var(--bd);background:var(--s1);color:var(--txt);cursor:pointer;font-family:inherit">상세 보기 →</button>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('oemList').innerHTML = html;
}

/* ════ 토글 ════ */
function toggleTrend(id, el) {
  const detail = document.getElementById('td-' + id);
  const arrow = document.getElementById('ta-' + id);
  if (openTrend && openTrend !== id) {
    const prev = document.getElementById('td-' + openTrend);
    const parrow = document.getElementById('ta-' + openTrend);
    if (prev) { prev.classList.remove('open'); parrow && parrow.classList.remove('open'); }
  }
  const isOpen = detail.classList.contains('open');
  detail.classList.toggle('open', !isOpen);
  arrow && arrow.classList.toggle('open', !isOpen);
  openTrend = isOpen ? null : id;
}

function toggleOem(id, el) {
  const detail = document.getElementById('od-' + id);
  const arrow = document.getElementById('oa-' + id);
  if (openOem && openOem !== id) {
    const prev = document.getElementById('od-' + openOem);
    const parrow = document.getElementById('oa-' + openOem);
    if (prev) { prev.classList.remove('open'); parrow && parrow.classList.remove('open'); }
  }
  const isOpen = detail.classList.contains('open');
  detail.classList.toggle('open', !isOpen);
  arrow && arrow.classList.toggle('open', !isOpen);
  openOem = isOpen ? null : id;
}

/* ════ 기간 탭 ════ */
function setPeriod(p, el) {
  currentPeriod = p;
  openTrend = null; openOem = null;
  document.querySelectorAll('#periodTabs .ptab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  renderAll();
}

/* ════ 재분석 버튼 ════ */
function rerunAnalysis() {
  const btn = document.querySelector('.btn-rerun');
  btn.textContent = '분석 중…';
  btn.disabled = true;
  setTimeout(() => {
    renderAll();
    btn.textContent = '↺ 재분석';
    btn.disabled = false;
    document.getElementById('updateLbl').textContent = '업데이트: ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});
  }, 800);
}

/* ════ DB 상세 (스텁) ════ */
function goToDbDetail(id) {
  const c = DB_REAL.find(d => d.id === id);
  if (!c) return;
  alert(`[TAB02 연동] ${c.name}\n지역: ${c.region}\n인증: ${(c.certs||[]).join(', ')||'없음'}\n\n(탭 통합 후 실제 상세 페이지로 이동)`);
}

/* ════ 전체 렌더 ════ */
function renderAll() {
  renderBrief();
  renderTrends();
  renderOEMs();
}

/* ════ 초기화 ════ */
document.getElementById('updateLbl').textContent = '업데이트: ' + new Date().toLocaleDateString('ko-KR');
renderAll();
</script>
</body>
</html>
