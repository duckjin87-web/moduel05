<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAB05 · AI 전략 분석 — CosmeDB</title>
<style>
:root{
  --navy:#1a2440;--acc:#e8622e;--cyn:#0891b2;--grn:#10b981;
  --red:#ef4444;--yel:#f59e0b;--pur:#8b5cf6;
  --s1:#f8f8f6;--s2:#efefec;--bd:rgba(0,0,0,.1);--bd2:rgba(0,0,0,.18);
  --txt:#1a1917;--txt2:#5c5a56;--txt3:#9b9892;
  --r:6px;--shadow:0 1px 4px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.07);
  --shadow-h:0 3px 12px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--txt);background:var(--s1);padding:12px 14px}
.wrap{max-width:1440px;margin:0 auto}

/* ── 헤더 ── */
.hd{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#fff;border-radius:var(--r);border:.5px solid var(--bd);margin-bottom:10px;box-shadow:var(--shadow);gap:8px;flex-wrap:wrap}
.hd-left{display:flex;align-items:center;gap:8px}
.hd-title{font-size:14px;font-weight:700;color:var(--navy)}
.ai-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;letter-spacing:.06em}
.hd-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ptab-wrap{display:flex;gap:2px;background:var(--s2);border-radius:4px;padding:2px}
.ptab{font-size:11px;padding:3px 11px;border-radius:3px;border:none;cursor:pointer;color:var(--txt2);background:transparent;font-family:inherit;transition:all .12s}
.ptab.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.update-lbl{font-size:10px;color:var(--txt3)}
.btn-rerun{font-size:10px;padding:4px 11px;border-radius:var(--r);border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;cursor:pointer;font-family:inherit;font-weight:600;transition:opacity .12s}
.btn-rerun:hover{opacity:.82}

/* ── AI 브리핑 ── */
.brief-wrap{margin-bottom:12px;border-radius:var(--r);background:linear-gradient(135deg,#1a2440 0%,#111827 100%);overflow:hidden;box-shadow:0 4px 20px rgba(26,36,64,.3);position:relative}
.brief-wrap::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.18) 0%,transparent 70%);pointer-events:none}
.brief-inner{padding:16px 20px;position:relative;z-index:1}
.brief-label{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.brief-label::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#6ee7b7;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.brief-text{font-size:13px;color:rgba(255,255,255,.88);line-height:1.75;margin-bottom:12px}
.brief-text strong{color:#fff}
.brief-pills{display:flex;gap:6px;flex-wrap:wrap}
.bpill{font-size:10px;padding:3px 10px;border-radius:20px;border:.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.75);background:rgba(255,255,255,.06)}
.bpill.hot{border-color:rgba(249,115,22,.5);color:#fdba74;background:rgba(249,115,22,.1)}
.bpill.oem{border-color:rgba(16,185,129,.45);color:#6ee7b7;background:rgba(16,185,129,.09)}
.bpill.warn{border-color:rgba(245,158,11,.45);color:#fcd34d;background:rgba(245,158,11,.09)}
.bpill.info{border-color:rgba(96,165,250,.45);color:#93c5fd;background:rgba(96,165,250,.09)}

/* ── 섹션 래퍼 ── */
.section-wrap{background:#fff;border:.5px solid var(--bd);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.section-hd{padding:10px 16px;border-bottom:.5px solid var(--bd);background:var(--s2);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.section-title{font-size:13px;font-weight:700;color:var(--navy)}
.section-meta{font-size:10px;color:var(--txt3)}

/* ═══════════════════════════════════
   트렌드 카드 그리드
═══════════════════════════════════ */
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:10px;padding:10px}
@media(max-width:860px){.t-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.t-grid{grid-template-columns:1fr}}

.t-card{background:#fff;border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:box-shadow .15s}
.t-card:hover{box-shadow:var(--shadow-h)}

/* 카드 헤더 행 */
.t-head{padding:11px 12px 9px;display:flex;gap:9px;align-items:flex-start}
.t-info{flex:1;min-width:0}
.t-name-row{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap}
.t-name{font-size:12px;font-weight:700;color:var(--txt)}
.no-type-badge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;background:#fff1f2;border:.5px solid #fecdd3;color:#be123c;white-space:nowrap}
.t-tags{display:flex;gap:3px;flex-wrap:wrap}
.tag{font-size:9px;padding:1px 5px;border-radius:3px}
.tag-cat{background:#dbeafe;color:#1e40af}
.tag-func{background:#d1fae5;color:#065f46}
.tag-ingr{background:#ede9fe;color:#5b21b6}

/* 메트릭 열 */
.t-metrics{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;min-width:80px}
.growth-big{font-size:16px;font-weight:800;color:var(--acc)}
.growth-lbl{font-size:8px;color:var(--txt3);text-align:right}
.conf-row{display:flex;align-items:center;gap:4px}
.conf-bg{width:48px;height:5px;background:var(--s2);border-radius:3px;overflow:hidden}
.conf-fill{height:100%;border-radius:3px}
.conf-num{font-size:9px;font-weight:600;color:var(--txt2)}
.opp-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid currentColor}
.opp-lbl{font-size:8px;color:var(--txt3);text-align:right}

/* 추천 OEM 미리보기 행 */
.t-oem-bar{padding:8px 12px;border-top:.5px solid var(--bd);background:#f9fafc;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.t-oem-mini{padding:6px 8px;border:.5px solid var(--bd);border-radius:5px;background:#fff;cursor:pointer;transition:all .12s}
.t-oem-mini:hover{border-color:var(--navy);background:#f0f4ff}
.oem-mini-name{font-size:10px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.oem-mini-row{display:flex;align-items:center;justify-content:space-between;gap:4px}
.oem-mini-score{font-size:11px;font-weight:700}
.oem-mini-trade{font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px}
.trade-shadow{background:#e0f2fe;color:#0369a1}
.trade-confirmed{background:#d1fae5;color:#065f46}
.oem-mini-certs{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}
.mc{font-size:8px;padding:0 4px;border-radius:2px;font-weight:600}

/* 선정 근거 간략 + 펼침 버튼 */
.t-brief{padding:8px 12px;border-top:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;transition:background .1s}
.t-brief:hover{background:var(--s1)}
.t-brief-txt{font-size:10px;color:var(--txt2);line-height:1.5;flex:1}
.t-brief-txt strong{color:var(--txt);font-weight:600}
.expand-arrow{font-size:10px;color:var(--txt3);flex-shrink:0;transition:transform .2s;user-select:none}
.expand-arrow.open{transform:rotate(180deg)}

/* 트렌드 확장 상세 */
.t-detail{padding:12px;background:#f0f4ff;border-top:.5px solid var(--bd);display:none;animation:fadeIn .15s ease}
.t-detail.open{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.detail-lbl{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.score-5row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.s5-item{text-align:center}
.s5-name{font-size:8px;color:var(--txt3);margin-bottom:3px}
.s5-donut{position:relative;width:38px;height:38px;margin:0 auto 2px}
.s5-svg{width:38px;height:38px;transform:rotate(-90deg)}
.s5-bg{fill:none;stroke:var(--s2);stroke-width:4}
.s5-fg{fill:none;stroke-width:4;stroke-linecap:round}
.s5-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.s5-max{font-size:8px;color:var(--txt3)}
.reason-list{list-style:none;display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.reason-item{display:flex;gap:6px;font-size:11px;color:var(--txt);line-height:1.5}
.r-icon{flex-shrink:0}
.risk-box{padding:7px 10px;border-radius:4px;font-size:11px;line-height:1.5;margin-bottom:10px}
.risk-med{background:#fffbf0;border:.5px solid #fde68a;color:#713f12}
.risk-low{background:#f0fdf4;border:.5px solid #a7f3d0;color:#065f46}
.risk-high{background:#fff1f2;border:.5px solid #fecdd3;color:#9f1239}
.src-row{display:flex;gap:4px;flex-wrap:wrap}
.src-tag{font-size:9px;padding:1px 6px;border-radius:3px;background:#e0f2fe;color:#0369a1}

/* ═══════════════════════════════════
   OEM 카드 그리드
═══════════════════════════════════ */
.o-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:10px;padding:10px}
@media(max-width:860px){.o-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.o-grid{grid-template-columns:1fr}}

.o-card{background:#fff;border:.5px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:box-shadow .15s}
.o-card:hover{box-shadow:var(--shadow-h)}

/* OEM 카드 헤더 */
.o-head{padding:11px 12px 9px;display:flex;gap:9px;align-items:flex-start}
.o-info{flex:1;min-width:0}
.o-name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.o-name{font-size:12px;font-weight:700;color:var(--txt)}
.trade-big{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px}
.trade-big.shadow{background:#eff6ff;color:#1d4ed8;border:.5px solid #bfdbfe}
.trade-big.confirmed{background:#f0fdf4;color:#15803d;border:.5px solid #bbf7d0}
.o-region{font-size:10px;color:var(--txt3);margin-bottom:6px}
.o-cert-row{display:flex;gap:3px;flex-wrap:wrap}
.cp{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:600}
.cp-cgmp{background:#fee2e2;color:#991b1b}
.cp-iso{background:#dbeafe;color:#1e40af}
.cp-vegan{background:#d1fae5;color:#065f46}
.cp-halal{background:#fef3c7;color:#92400e}
.cp-otc{background:#ede9fe;color:#5b21b6}
.cp-na{background:var(--s2);color:var(--txt3)}

/* 오른쪽 점수 블록 */
.o-score-block{flex-shrink:0;text-align:center;min-width:64px}
.hs-num{font-size:26px;font-weight:800;line-height:1}
.hs-lbl{font-size:8px;color:var(--txt3);margin-top:2px}
.hs-sub{font-size:9px;font-weight:600;margin-top:4px}

/* 발굴 사유 블록 */
.o-reasons{padding:8px 12px;border-top:.5px solid var(--bd);background:#f9fafc;display:flex;flex-direction:column;gap:4px}
.o-reason{display:flex;gap:6px;font-size:11px;color:var(--txt);line-height:1.5}
.o-reason-icon{flex-shrink:0;font-size:12px}

/* 확장 버튼 */
.o-expand-btn{padding:8px 12px;border-top:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .1s;background:#fff}
.o-expand-btn:hover{background:var(--s1)}
.o-expand-label{font-size:10px;color:var(--cyn);font-weight:500}

/* OEM 확장 상세 */
.o-detail{padding:12px;background:#f0f4ff;border-top:.5px solid var(--bd);display:none;animation:fadeIn .15s ease}
.o-detail.open{display:block}
.growth-stage-box{display:flex;align-items:center;gap:10px;background:#fff;border:.5px solid var(--bd);border-radius:4px;padding:8px 12px;margin-bottom:10px}
.gs-block{flex:1;text-align:center}
.gs-label{font-size:9px;color:var(--txt3);margin-bottom:2px}
.gs-val{font-size:11px;font-weight:600;color:var(--navy)}
.gs-arrow{font-size:20px;color:var(--cyn);flex-shrink:0}
.rec-cat-list{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.rec-cat{font-size:10px;padding:3px 9px;border-radius:3px;background:#dbeafe;color:#1e40af;font-weight:500}
.btn-db-det{font-size:10px;padding:4px 10px;border-radius:4px;border:.5px solid var(--bd);background:#fff;color:var(--txt);cursor:pointer;font-family:inherit}
.btn-db-det:hover{background:var(--s2)}

/* 뱃지 공통 */
.badge{display:inline-block;font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px}
.badge-grn{background:#d1fae5;color:#065f46}
.badge-sky{background:#e0f2fe;color:#0369a1}

/* rank badge */
.rank-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.rb-gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.rb-silver{background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff}
.rb-bronze{background:linear-gradient(135deg,#b45309,#92400e);color:#fff}
.rb-top10{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff}
.rb-rest{background:var(--s2);color:var(--txt3)}

.bottom-pad{height:28px}
</style>
</head>

/* ══ OEM 점수 산정 ══ */
function scoreOEM(c) {
  const certs = c.certs||[], ind=(c.industry||'').toLowerCase();
  const isCosm = ind.includes('화장품')||ind.includes('제조');
  let prod=0,tech=0,growth=0,expo=0,attr=0;
  if(certs.includes('CGMP')) prod+=10;
  if(certs.some(x=>x.includes('ISO22716'))) prod+=8;
  if(isCosm) prod+=2;
  prod=Math.min(prod,20);
  if(certs.includes('ISO9001'))  tech+=5;
  if(certs.includes('ISO14001')) tech+=4;
  if(certs.includes('ISO45001')) tech+=3;
  if(certs.includes('ISO13485')) tech+=5;
  if(certs.length>=5) tech+=3;
  if(certs.length>=7) tech+=2;
  tech=Math.min(tech,20);
  if(c.status==='SHADOW') growth+=8;
  if(certs.length>=3) growth+=5;
  if(['세종','충청'].includes(c.region)) growth+=3;
  else if(['인천','경기'].includes(c.region)) growth+=2;
  growth+=Math.min(Math.floor(certs.length*.6),4);
  growth=Math.min(Math.round(growth),20);
  if(certs.includes('할랄')) expo+=12;
  if(certs.includes('비건')) expo+=8;
  if(certs.includes('OTC DRUG')) expo+=5;
  if(certs.includes('ISO13485')) expo+=4;
  expo=Math.min(expo,20);
  if(c.status==='SHADOW') attr+=10;
  if(prod>=16) attr+=6; else if(prod>=8) attr+=3;
  if(isCosm) attr+=4;
  attr=Math.min(attr,20);
  return {...c,s:{prod,tech,growth,expo,attr},total:prod+tech+growth+expo+attr};
}

function buildOemReasons(c) {
  const certs=c.certs||[], r=[];
  if(certs.includes('CGMP')&&certs.some(x=>x.includes('ISO22716')))
    r.push({icon:'✅',txt:`CGMP + ISO22716 보유 — GMP 기반 국제 기준 생산 체계`});
  else if(certs.includes('CGMP'))
    r.push({icon:'✅',txt:'CGMP 인증 보유 — GMP 기반 고품질 생산 체계 검증'});
  else if(certs.some(x=>x.includes('ISO22716')))
    r.push({icon:'✅',txt:'ISO22716 보유 — 국제 기준 화장품 GMP 적용'});
  if(certs.includes('할랄')) r.push({icon:'🌍',txt:'할랄 인증 — 중동·동남아 즉시 수출 가능 (시장 +51%)'});
  if(certs.includes('비건')) r.push({icon:'🌿',txt:'비건 인증 — 글로벌 클린뷰티 수요 직접 대응'});
  if(certs.includes('OTC DRUG')) r.push({icon:'💊',txt:'OTC 의약외품 제조 가능 — 기능성 고부가가치'});
  if(c.status==='SHADOW') r.push({icon:'💡',txt:'현재 미거래 상태 — 독점 거래선 선점 기회'});
  if(certs.length>=5) r.push({icon:'🏆',txt:`인증 ${certs.length}개 보유 — 체계적 품질·환경 관리`});
  if(['세종','충청'].includes(c.region)) r.push({icon:'🏭',txt:'세종/충청 산업단지 — 생산비용 경쟁력'});
  return r.slice(0,4);
}

function buildOemCategories(c) {
  const certs=c.certs||[], ind=(c.industry||'').toLowerCase(), cats=[];
  if(ind.includes('화장품')||certs.some(x=>x.includes('ISO22716'))) cats.push('스킨케어');
  if(certs.some(x=>x.includes('ISO22716'))) cats.push('마스크팩');
  if(certs.includes('CGMP')) cats.push('앰플/세럼');
  if(certs.includes('할랄')) cats.push('할랄 화장품');
  if(certs.includes('비건')) cats.push('비건 화장품');
  if(certs.includes('OTC DRUG')) cats.push('기능성 화장품');
  return [...new Set(cats)].slice(0,4);
}

function getGrowthStage(t) {
  if(t>=85) return {now:'중소 OEM',pred:'중견 OEM 진입',period:'1~2년'};
  if(t>=70) return {now:'중소 OEM',pred:'중견 OEM 준비',period:'2년'};
  if(t>=55) return {now:'소규모 OEM',pred:'중소 OEM 성장',period:'2~3년'};
  return            {now:'소규모 OEM',pred:'안정 중소 OEM',period:'3년'};
}

/* ══ 유틸 색상 ══ */
function oppColor(s){return s>=75?'#10b981':s>=58?'#f59e0b':'#ef4444'}
function barColor(v,m){const p=v/m;return p>=.75?'#10b981':p>=.5?'#f59e0b':'#ef4444'}
function certClass(c){
  if(c.includes('CGMP')) return 'cp-cgmp';
  if(c.includes('ISO')) return 'cp-iso';
  if(c==='비건') return 'cp-vegan';
  if(c==='할랄') return 'cp-halal';
  if(c.includes('OTC')) return 'cp-otc';
  return 'cp-na';
}
function rankBadgeClass(r){
  if(r===1) return 'rb-gold';
  if(r===2) return 'rb-silver';
  if(r===3) return 'rb-bronze';
  if(r<=10) return 'rb-top10';
  return 'rb-rest';
}
function donutSVG(val,max,color){
  const r=15,c=2*Math.PI*r,pct=Math.min(val/max,1);
  return `<svg class="s5-svg" viewBox="0 0 40 40">
    <circle class="s5-bg" cx="20" cy="20" r="${r}"/>
    <circle class="s5-fg" cx="20" cy="20" r="${r}" stroke="${color}"
      stroke-dasharray="${(pct*c).toFixed(1)} ${c.toFixed(1)}"/>
  </svg>`;
}

/* ══ OEM 점수 캐시 ══ */
let cachedOemScores = null;
function getOemScores() {
  if(!cachedOemScores) {
    const filter = DB_REAL.filter(c=>{
      const certs=c.certs||[], ind=(c.industry||'').toLowerCase();
      const hasCert=certs.some(x=>['CGMP','비건','할랄','OTC DRUG'].includes(x)||x.includes('ISO22716'));
      const isMfg=ind.includes('화장품')||ind.includes('제조');
      const isPurePkg=(ind.includes('용기')||(ind.includes('플라스틱')&&!hasCert));
      return (hasCert||isMfg)&&!isPurePkg;
    });
    cachedOemScores = filter.map(scoreOEM).sort((a,b)=>b.total-a.total);
  }
  return cachedOemScores;
}

/* ══ 브리핑 ══ */

    '6m':'<strong>중기(6개월) 전략 방향:</strong> PDRN 진정 앰플이 미국 선행 트렌드를 9개월 격차로 추격하며 국내 최대 성장 카테고리로 부상 중입니다. <strong>Hidden OEM 3개사</strong>가 할랄·비건 이중 인증으로 즉시 글로벌 대응 가능한 상태이며, 선제 접촉을 권장합니다.',
    '1y':'<strong>장기(1년) 포지셔닝:</strong> 클린뷰티·마이크로바이옴·의료화장품 경계 해소 3대 메가트렌드가 K뷰티를 재편합니다. EU 미세플라스틱 금지(2027)와 MoCRA 정착으로 <strong>인증·컴플라이언스 체계를 갖춘 OEM이 구조적 우위</strong>를 확보합니다.',
  };
  document.getElementById('briefText').innerHTML = briefs[currentPeriod];
  document.getElementById('briefPills').innerHTML = [

    `<span class="bpill oem">🏭 Hidden OEM #1 · 95점</span>`,
    `<span class="bpill warn">⚠️ 레티놀 규제 2026.07.01</span>`,
    `<span class="bpill info">📊 ${cfg.label} 기준</span>`,
  ].join('');
}

/* ══ 트렌드 렌더 ══ */
function renderTrends() {
  const cfg = PERIOD_CFG[currentPeriod];
  document.getElementById('trendMeta').textContent = cfg.label + ' · ' + new Date().toLocaleDateString('ko-KR');
  const oemScored = getOemScores();

  const html = TREND_BASE.map((t, idx) => {
    const rank = idx+1;
    const g = Math.round(t.growth * cfg.growthMul);
    const conf = Math.min(cfg.confCap, Math.max(45, t.conf + cfg.confAdd));
    const opp = t.scores.market+t.scores.growth+t.scores.comp+t.scores.prod+t.scores.reg;
    const oc = oppColor(opp);
    const confColor = conf>=85?'#10b981':conf>=70?'#f59e0b':'#ef4444';
    const noType = !PORTFOLIO_TYPES.has(t.cat);

    // 추천 OEM 미리보기 (상위 2개)
    const topOems = (t.recIds||[]).slice(0,2).map(id=>{
      const scored = oemScored.find(o=>o.id===id);
      if(!scored) return '';
      const keyC = (scored.certs||[]).filter(c=>['CGMP','비건','할랄','ISO22716'].includes(c)||c.includes('ISO22716')).slice(0,3);
      const tradeHtml = scored.status==='SHADOW'
        ? '<span class="oem-mini-trade trade-shadow">미거래★</span>'
        : '<span class="oem-mini-trade trade-confirmed">거래중</span>';
      const miniCerts = keyC.map(c=>`<span class="mc ${certClass(c)}">${c.replace('ISO22716','ISO22716')}</span>`).join('');
      const sc = scored.total>=75?'#10b981':scored.total>=55?'#f59e0b':'#ef4444';
      return `<div class="t-oem-mini" onclick="goToDbDetail(${scored.id})">
        <div class="oem-mini-name">${scored.name}</div>
        <div class="oem-mini-row">
          <span class="oem-mini-score" style="color:${sc}">${scored.total}점</span>
          ${tradeHtml}
        </div>
        <div class="oem-mini-certs">${miniCerts}</div>
      </div>`;
    }).join('');

    const reasonsHtml = t.reasons.map(r=>
      `<li class="reason-item"><span class="r-icon">${r.icon}</span>${r.txt}</li>`
    ).join('');

    const riskCls = t.risk.level==='low'?'risk-low':t.risk.level==='high'?'risk-high':'risk-med';

    const scoreItems = [
      {name:'시장성',val:t.scores.market,max:25},
      {name:'성장성',val:t.scores.growth,max:30},
      {name:'경쟁강도',val:t.scores.comp,max:15},
      {name:'생산용이',val:t.scores.prod,max:15},
      {name:'규제안전',val:t.scores.reg,max:15},
    ];
    const score5Html = scoreItems.map(si=>{
      const sc=barColor(si.val,si.max);
      return `<div class="s5-item">
        <div class="s5-name">${si.name}</div>
        <div class="s5-donut">${donutSVG(si.val,si.max,sc)}
          <div class="s5-num" style="color:${sc}">${si.val}</div>
        </div>
        <div class="s5-max">/${si.max}</div>
      </div>`;
    }).join('');

    const srcHtml = (t.sources||[]).map(s=>`<span class="src-tag">${s}</span>`).join('');

    return `<div class="t-card">
      <div class="t-head">
        <div class="rank-badge ${rankBadgeClass(rank)}">${rank}</div>
        <div class="t-info">
          <div class="t-name-row">
            <span class="t-name">${t.name}</span>
            ${noType?'<span class="no-type-badge">미보유 유형</span>':''}
          </div>
          <div class="t-tags">
            <span class="tag tag-cat">${t.cat}</span>
            <span class="tag tag-func">${t.func}</span>
            <span class="tag tag-ingr">${t.ingr}</span>
          </div>
        </div>
        <div class="t-metrics">
          <div>
            <div class="growth-big">+${g}%</div>
            <div class="growth-lbl">예상성장률</div>
          </div>
          <div>
            <div class="conf-row">
              <div class="conf-bg"><div class="conf-fill" style="width:${conf}%;background:${confColor}"></div></div>
              <span class="conf-num">${conf}%</span>
            </div>
            <div class="growth-lbl">신뢰도</div>
          </div>
          <div>
            <div class="opp-circle" style="color:${oc};border-color:${oc}">${opp}</div>
            <div class="opp-lbl">기회점수</div>
          </div>
        </div>
      </div>

      <div class="t-oem-bar" style="grid-template-columns:${topOems?'1fr 1fr':'1fr'}">
        ${topOems||'<div style="font-size:10px;color:var(--txt3);padding:2px 0">추천 OEM 데이터 연동 예정</div>'}
      </div>

      <div class="t-brief" onclick="toggleTrend(${t.id}, this)">
        <span class="t-brief-txt"><strong>💡</strong> ${t.briefReason}</span>
        <span class="expand-arrow" id="ta-${t.id}">▼</span>
      </div>

      <div class="t-detail" id="td-${t.id}">
        <div class="detail-lbl" style="margin-bottom:7px">점수 구성 (합계 ${opp}/100)</div>
        <div class="score-5row">${score5Html}</div>
        <div class="detail-lbl" style="margin-bottom:6px">AI 분석 근거</div>
        <ul class="reason-list">${reasonsHtml}</ul>
        <div class="detail-lbl" style="margin-bottom:5px">리스크 평가</div>
        <div class="risk-box ${riskCls}" style="margin-bottom:10px">${t.risk.txt}</div>
        <div class="detail-lbl" style="margin-bottom:5px">데이터 소스</div>
        <div class="src-row">${srcHtml}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('trendList').innerHTML = html;
}

/* ══ OEM 렌더 ══ */
function renderOEMs() {
  const scored = getOemScores().slice(0,20);
  document.getElementById('oemMeta').textContent = `DB ${DB_REAL.length}개사 중 상위 20개`;

  const html = scored.map((c,idx)=>{
    const rank = idx+1;
    const sc = c.total>=75?'#10b981':c.total>=55?'#f59e0b':'#ef4444';
    const tradeCls = c.status==='SHADOW'?'shadow':'confirmed';
    const tradeLbl = c.status==='SHADOW'?'미거래 ★':'거래 중 ✓';
    const certHtml = (c.certs||[]).slice(0,6).map(cert=>
      `<span class="cp ${certClass(cert)}">${cert}</span>`
    ).join('');

    const reasons = buildOemReasons(c);
    const reasonsHtml = reasons.map(r=>
      `<div class="o-reason"><span class="o-reason-icon">${r.icon}</span>${r.txt}</div>`
    ).join('');

    const cats = buildOemCategories(c);
    const catsHtml = cats.map(cat=>`<span class="rec-cat">${cat}</span>`).join('');
    const stage = getGrowthStage(c.total);

    const scoreItems = [
      {name:'생산력',val:c.s.prod,max:20},
      {name:'기술력',val:c.s.tech,max:20},
      {name:'성장성',val:c.s.growth,max:20},
      {name:'수출역량',val:c.s.expo,max:20},
      {name:'거래매력',val:c.s.attr,max:20},
    ];
    const score5Html = scoreItems.map(si=>{
      const bsc=barColor(si.val,si.max);
      return `<div class="s5-item">
        <div class="s5-name">${si.name}</div>
        <div class="s5-donut">${donutSVG(si.val,si.max,bsc)}
          <div class="s5-num" style="color:${bsc}">${si.val}</div>
        </div>
        <div class="s5-max">/${si.max}</div>
      </div>`;
    }).join('');

    return `<div class="o-card">
      <div class="o-head">
        <div class="rank-badge ${rankBadgeClass(rank)}">${rank}</div>
        <div class="o-info">
          <div class="o-name-row">
            <span class="o-name">${c.name}</span>
            <span class="trade-big ${tradeCls}">${tradeLbl}</span>
          </div>
          <div class="o-region">${c.region} · ${c.code}</div>
          <div class="o-cert-row">${certHtml||'<span class="cp cp-na">인증없음</span>'}</div>
        </div>
        <div class="o-score-block">
          <div class="hs-num" style="color:${sc}">${c.total}</div>
          <div class="hs-lbl">Hidden Score</div>
          <div class="hs-sub" style="color:${sc}">/100</div>
        </div>
      </div>

      <div class="o-reasons">${reasonsHtml}</div>

      <div class="o-expand-btn" onclick="toggleOem(${c.id},this)">
        <span class="o-expand-label">점수 상세 · 성장단계 · 추천 생산 분야 보기</span>
        <span class="expand-arrow" id="oa-${c.id}">▼</span>
      </div>

      <div class="o-detail" id="od-${c.id}">
        <div class="growth-stage-box">
          <div class="gs-block">
            <div class="gs-label">현재 단계</div>
            <div class="gs-val">${stage.now}</div>
          </div>
          <div class="gs-arrow">→</div>
          <div class="gs-block">
            <div class="gs-label">예상 (${stage.period})</div>
            <div class="gs-val" style="color:var(--cyn)">${stage.pred}</div>
          </div>
        </div>
        <div class="detail-lbl" style="margin-bottom:6px">점수 구성</div>
        <div class="score-5row" style="margin-bottom:10px">${score5Html}</div>
        <div class="detail-lbl" style="margin-bottom:6px">추천 생산 분야</div>
        <div class="rec-cat-list" style="margin-bottom:10px">${catsHtml||'<span style="font-size:11px;color:var(--txt3)">분류 데이터 부족</span>'}</div>
        <button class="btn-db-det" onclick="goToDbDetail(${c.id})">상세 보기 (TAB02) →</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('oemList').innerHTML = html;
}

/* ══ 토글 ══ */
function toggleTrend(id) {
  const d=document.getElementById('td-'+id), a=document.getElementById('ta-'+id);
  const isOpen=d.classList.contains('open');
  d.classList.toggle('open',!isOpen);
  a&&a.classList.toggle('open',!isOpen);
}
function toggleOem(id) {
  const d=document.getElementById('od-'+id), a=document.getElementById('oa-'+id);
  const isOpen=d.classList.contains('open');
  d.classList.toggle('open',!isOpen);
  a&&a.classList.toggle('open',!isOpen);
}

/* ══ 기간 탭 ══ */
function setPeriod(p,el) {
  currentPeriod=p;
  document.querySelectorAll('#periodTabs .ptab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderBrief(); renderTrends();
}

/* ══ 재분석 ══ */
function rerunAnalysis() {
  const btn=document.querySelector('.btn-rerun');
  btn.textContent='분석 중…'; btn.disabled=true;
  setTimeout(()=>{
    cachedOemScores=null;
    renderAll();
    btn.textContent='↺ 재분석'; btn.disabled=false;
    document.getElementById('updateLbl').textContent='업데이트: '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  },700);
}

/* ══ DB 상세 스텁 ══ */
function goToDbDetail(id) {
  const c=DB_REAL.find(d=>d.id===id);
  if(!c) return;
  alert(`[TAB02 연동] ${c.name}\n지역: ${c.region}\n인증: ${(c.certs||[]).join(', ')||'없음'}\n\n(탭 통합 후 실제 상세 페이지로 이동)`);
}

/* ══ 전체 렌더 ══ */
function renderAll(){ renderBrief(); renderTrends(); renderOEMs(); }

document.getElementById('updateLbl').textContent='업데이트: '+new Date().toLocaleDateString('ko-KR');
renderAll();
</script>
