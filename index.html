<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 전략 분석 — CosmeDB</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ══ 헤더 ══ -->
<header id="site-header">
  <div class="hdr-left">
    <span class="site-name">CosmeDB</span>
    <span class="hdr-div">|</span>
    <span class="page-title">AI 전략 분석</span>
  </div>
  <div class="hdr-center">
    <div class="period-tabs" role="tablist" id="periodTabs">
      <button class="period-tab" role="tab" data-period="1m">1개월</button>
      <button class="period-tab active" role="tab" data-period="6m">6개월</button>
      <button class="period-tab" role="tab" data-period="1y">1년</button>
    </div>
  </div>
  <div class="hdr-right">
    <span class="meta-text" id="updateLbl"></span>
    <button class="btn-rerun" id="btnRerun">↺ 재분석</button>
    <button class="btn-icon" id="btnTheme" aria-label="다크/라이트 전환">◑</button>
  </div>
</header>

<div class="wrap">

  <!-- ══ AI 전략 브리핑 ══ -->
  <section class="brief-section" id="briefSection">
    <div class="brief-head">
      <span class="brief-badge">AI 전략 브리핑</span>
      <div class="env-chips" id="envChips"></div>
    </div>
    <p class="brief-text" id="briefText"></p>
    <div class="brief-pills" id="briefPills"></div>
    <div class="brief-sources" id="briefSources"></div>
  </section>

  <!-- ══ 모바일 탭 ══ -->
  <div class="mobile-tabs" role="tablist" id="mobileTabs">
    <button class="mobile-tab active" role="tab" data-col="trend">AI 트렌드 예측</button>
    <button class="mobile-tab" role="tab" data-col="oem">Hidden OEM 발굴</button>
  </div>

  <!-- ══ 2열 메인 ══ -->
  <div class="main-grid">

    <!-- 왼쪽: AI 트렌드 예측 -->
    <section class="col-section" id="trendSection" data-col="trend">
      <div class="col-hdr">
        <h2 class="col-title">AI 화장품 트렌드 예측</h2>
        <span class="col-meta" id="trendMeta"></span>
      </div>
      <div id="topRecBanner"></div>
      <div id="trendList" role="list"></div>
      <div class="more-wrap" id="trendMoreWrap">
        <button class="btn-more" id="btnMoreTrend">+ 10개 더 보기</button>
      </div>
    </section>

    <!-- 오른쪽: AI Hidden OEM 발굴 -->
    <section class="col-section" id="oemSection" data-col="oem">
      <div class="col-hdr">
        <h2 class="col-title">AI Hidden OEM 발굴</h2>
        <span class="col-meta" id="oemMeta"></span>
      </div>
      <div id="oemList" role="list"></div>
      <div class="more-wrap" id="oemMoreWrap">
        <button class="btn-more" id="btnMoreOem">+ 10개 더 보기</button>
      </div>
    </section>

  </div><!-- /main-grid -->
</div><!-- /wrap -->

<footer class="site-footer">
  <span id="footerText"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
