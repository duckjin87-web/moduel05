<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAB04 · 트렌드 분석 — CosmeDB</title>
<style>
:root{
  --navy:#1a2440;--acc:#e8622e;--cyn:#0891b2;--grn:#10b981;
  --red:#ef4444;--yel:#f59e0b;--pur:#8b5cf6;
  --s1:#f8f8f6;--s2:#efefec;--bd:rgba(0,0,0,.1);--bd2:rgba(0,0,0,.18);
  --txt:#1a1917;--txt2:#5c5a56;--txt3:#9b9892;
  --r:6px;--shadow:0 1px 4px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.07);
  --shadow-h:0 3px 10px rgba(0,0,0,.11),0 0 0 .5px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--txt);background:var(--s1);padding:12px 14px}
/* 레이아웃 */
.wrap{max-width:1440px;margin:0 auto}
/* 헤더 */
.hd{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#fff;border-radius:var(--r);border:.5px solid var(--bd);margin-bottom:10px;box-shadow:var(--shadow);gap:8px;flex-wrap:wrap}
.hd-title{font-size:14px;font-weight:700;color:var(--navy)}
.hd-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ptab-wrap{display:flex;gap:2px;background:var(--s2);border-radius:4px;padding:2px}
.ptab{font-size:11px;padding:3px 10px;border-radius:3px;border:none;cursor:pointer;color:var(--txt2);background:transparent;font-family:inherit;transition:all .12s}
.ptab.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* Action Strip */
.action-strip{margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
.action-row{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--r);border:.5px solid var(--bd);background:#fff;font-size:11px;cursor:pointer;transition:box-shadow .1s;box-shadow:var(--shadow)}
.action-row:hover{box-shadow:var(--shadow-h)}
.action-row.danger{background:#fff8f7;border-color:#fca5a5}
.action-row.warn{background:#fffbf0;border-color:#fde68a}
.action-row.info{background:#f0fdf4;border-color:#a7f3d0}
.action-icon{font-size:14px;flex-shrink:0}
.action-txt{flex:1;color:var(--txt)}
.action-link{font-size:10px;color:var(--cyn);white-space:nowrap}
/* ROW 1: 3열 */
.row1{display:grid;grid-template-columns:1fr 0.75fr 1fr;gap:10px;margin-bottom:10px}
@media(max-width:1060px){.row1{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.row1{grid-template-columns:1fr}}
/* ROW 2: 뉴스 */
.row2{margin-bottom:10px}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
/* ROW 3: 2열 */
.row3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.row3{grid-template-columns:1fr}}
/* 카드 */
.card{background:#fff;border:.5px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow-h)}
.card-hd{padding:8px 12px 7px;border-bottom:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;background:var(--s2)}
.card-title{font-size:12px;font-weight:700;color:var(--navy)}
.card-sub{font-size:10px;color:var(--txt3)}
/* 서브탭 */
.stab-bar{display:flex;border-bottom:.5px solid var(--bd);overflow-x:auto}
.stab{font-size:11px;padding:5px 9px;border:none;background:transparent;cursor:pointer;color:var(--txt3);font-family:inherit;border-bottom:2px solid transparent;white-space:nowrap;transition:all .12s}
.stab.on{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
.stab:hover:not(.on){background:var(--s1)}
/* 뱃지 */
.badge{display:inline-block;font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-yel{background:#fef9c3;color:#713f12}
.badge-grn{background:#d1fae5;color:#065f46}
.badge-sky{background:#e0f2fe;color:#0369a1}
.badge-gray{background:var(--s2);color:var(--txt2)}
.badge-pur{background:#ede9fe;color:#5b21b6}
/* 뉴스 */
.news-item{padding:9px 13px;border-right:.5px solid var(--bd);border-bottom:.5px solid var(--bd);cursor:pointer;transition:background .1s}
.news-item:hover{background:var(--s1)}
.news-item.issue{background:#fff8f7;border-left:3px solid var(--red);padding-left:10px}
.news-item.issue:hover{background:#fee2e2}
.news-item.warn{background:#fffbf0;border-left:3px solid var(--yel);padding-left:10px}
.news-flag{display:flex;align-items:center;gap:4px;margin-bottom:3px;flex-wrap:wrap}
.news-title{font-size:11px;color:var(--txt);line-height:1.5;font-weight:500}
.news-meta{font-size:9px;color:var(--txt3);margin-top:2px;display:flex;gap:8px}
.news-db-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.db-chip{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:500;cursor:pointer;border:none}
.db-chip.confirmed{background:#d1fae5;color:#065f46}
.db-chip.shadow{background:#fef3c7;color:#92400e}
/* 제품 순위 */
.prod-item{display:flex;align-items:flex-start;gap:7px;padding:7px 11px;border-bottom:.5px solid var(--bd);cursor:pointer;transition:background .1s}
.prod-item:hover{background:var(--s1)}
.prod-item:last-child{border-bottom:none}
.rank{font-size:12px;font-weight:700;min-width:18px;color:var(--txt3);padding-top:1px}
.rank.r1{color:#c4891a}.rank.r2{color:#7a8799}.rank.r3{color:#a06040}
.prod-body{flex:1;min-width:0}
.prod-name{font-size:11px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-brand{font-size:10px;color:var(--txt2);margin-top:1px}
.prod-mfr{font-size:10px;margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mfr-ok{color:var(--grn);font-weight:600}
.mfr-na{color:var(--txt3)}
.stat-up{font-size:10px;font-weight:700;color:var(--acc)}
.stat-dn{font-size:10px;font-weight:700;color:var(--cyn)}
/* 제조업체 순위 */
.mfr-item{display:flex;align-items:center;gap:7px;padding:7px 11px;border-bottom:.5px solid var(--bd)}
.mfr-item:last-child{border-bottom:none}
.mfr-name-txt{flex:1;font-size:11px;font-weight:500;color:var(--txt)}
.mfr-sub{font-size:9px;color:var(--txt3);margin-top:1px}
/* 추천 업체 */
.hint-bar{padding:6px 12px;font-size:10px;background:#f0fdf4;color:#065f46;border-bottom:.5px solid var(--bd)}
.rec-card{margin:7px 10px;padding:9px 11px;border:.5px solid var(--bd);border-radius:var(--r);transition:box-shadow .12s}
.rec-card:hover{box-shadow:var(--shadow)}
.rec-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px;gap:4px}
.rec-name{font-size:12px;font-weight:600;color:var(--navy)}
.rec-badges{display:flex;gap:3px;flex-wrap:wrap;flex-shrink:0}
.rec-meta{font-size:10px;color:var(--txt2);margin-bottom:4px;line-height:1.5}
.rec-forms{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.form-tag{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--s2);color:var(--txt2)}
.form-tag.match{background:#dbeafe;color:#1e40af;font-weight:600}
.rec-certs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px}
.cert-chip{font-size:9px;padding:1px 5px;border-radius:3px;background:#d1fae5;color:#065f46;font-weight:600}
.rec-actions{display:flex;gap:5px}
.btn-det{font-size:10px;padding:3px 8px;border-radius:var(--r);border:.5px solid var(--bd);background:var(--s1);color:var(--txt);cursor:pointer;font-family:inherit}
.btn-det:hover{background:var(--s2)}
.btn-srch{font-size:10px;padding:3px 8px;border-radius:var(--r);border:none;background:var(--navy);color:#fff;cursor:pointer;font-family:inherit}
.btn-srch:hover{opacity:.85}
/* 글로벌 테이블 */
.global-tbl{width:100%;border-collapse:collapse;font-size:11px}
.global-tbl th{padding:6px 10px;background:var(--s2);color:var(--txt2);font-weight:600;text-align:left;font-size:10px;border-bottom:.5px solid var(--bd)}
.global-tbl td{padding:6px 10px;border-top:.5px solid var(--bd);color:var(--txt);vertical-align:top;font-size:11px}
.global-tbl tr:hover td{background:var(--s1)}
/* 공급공백 */
.no-supply{margin:10px;padding:12px;border:1px dashed var(--acc);border-radius:var(--r);background:#fff9f7;text-align:center}
.no-supply p{font-size:11px;color:var(--txt2);margin-bottom:8px;line-height:1.6}
.btn-find{font-size:11px;padding:5px 14px;border-radius:var(--r);border:none;background:var(--acc);color:#fff;cursor:pointer;font-family:inherit;font-weight:600}
.btn-find:hover{opacity:.85}
/* 법령 섹션 */
.reg-item{padding:8px 12px;border-bottom:.5px solid var(--bd)}
.reg-item:last-child{border-bottom:none}
.reg-item.critical{background:#fff8f7;border-left:3px solid var(--red);padding-left:10px}
.reg-item.upcoming{background:#fffbf0;border-left:3px solid var(--yel);padding-left:10px}
.reg-title{font-size:11px;font-weight:500;color:var(--txt);line-height:1.5;margin-bottom:2px}
.reg-meta{font-size:9px;color:var(--txt3);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.reg-impact{font-size:9px;margin-top:3px;padding:3px 6px;border-radius:3px;display:inline-block}
.reg-impact.high{background:#fee2e2;color:#991b1b}
.reg-impact.mid{background:#fef3c7;color:#92400e}
.reg-impact.low{background:#d1fae5;color:#065f46}
/* 인사이트 */
.insight-row{padding:8px 12px;border-bottom:.5px solid var(--bd)}
.insight-row:last-child{border-bottom:none}
.insight-label{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;margin-bottom:3px;letter-spacing:.06em}
.insight-txt{font-size:11px;color:var(--txt);line-height:1.6}
.insight-action{font-size:10px;color:var(--cyn);margin-top:3px;font-style:italic}
/* 리포트 */
.report-btn{font-size:10px;padding:3px 9px;border-radius:var(--r);border:.5px solid var(--bd2);background:#fff;color:var(--txt2);cursor:pointer;font-family:inherit}
.report-btn:hover{background:var(--s2)}
/* 필터 토글 */
.toggle-wrap{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--txt2)}
.toggle-sw{width:28px;height:16px;border-radius:8px;background:var(--bd2);border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle-sw.on{background:var(--navy)}
.toggle-sw::after{content:'';position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s}
.toggle-sw.on::after{left:14px}
/* 공통 버튼 */
.btn-sm{font-size:10px;padding:3px 8px;border-radius:var(--r);border:.5px solid var(--bd);background:var(--s1);color:var(--txt2);cursor:pointer;font-family:inherit}
.btn-sm:hover{background:var(--s2)}
.btn-add{font-size:10px;padding:2px 7px;border-radius:3px;border:.5px solid var(--acc);background:#fff7f5;color:var(--acc);cursor:pointer;font-family:inherit}
.btn-add:hover{background:var(--acc);color:#fff}
.btn-db{font-size:10px;padding:2px 7px;border-radius:3px;border:.5px solid var(--grn);background:#f0fdf4;color:#065f46;cursor:pointer;font-family:inherit}
.btn-db:hover{background:var(--grn);color:#fff}
.empty{padding:18px;text-align:center;color:var(--txt3);font-size:11px}
</style>
</head>
<body>
<div class="wrap">

<!-- ══ 헤더 ══ -->
<div class="hd">
  <div class="hd-title">📈 트렌드 분석</div>
  <div class="hd-right">
    <div class="ptab-wrap" id="periodTabs">
      <button class="ptab" onclick="setTrendPeriod('today',this)">오늘</button>
      <button class="ptab on" onclick="setTrendPeriod('week',this)">1주</button>
      <button class="ptab" onclick="setTrendPeriod('month',this)">1달</button>
      <button class="ptab" onclick="setTrendPeriod('year',this)">1년</button>
    </div>
    <span id="periodLabel" style="font-size:10px;color:var(--txt3)">최근 1주 기준</span>
    <button class="report-btn" onclick="copyReport()">📋 보고서 복사</button>
  </div>
</div>

<!-- ══ Action Strip ══ -->
<div class="action-strip" id="actionStrip"></div>

<!-- ══ ROW 1: 트렌드 3열 ══ -->
<div class="row1">
  <!-- 국내 트렌드 -->
  <div class="card">
    <div class="card-hd">
      <span class="card-title">🇰🇷 국내 트렌드 — 추천 업체</span>
      <div style="display:flex;align-items:center;gap:5px">
        <label class="toggle-wrap">
          <button class="toggle-sw" id="newOnlyToggle" onclick="toggleNewOnly(this)"></button>
          미거래만
        </label>
        <button class="btn-sm" onclick="goToTrendSearch()">🔍 신규 발굴</button>
      </div>
    </div>
    <div class="hint-bar" id="trendHint"></div>
    <div id="trendRecList"></div>
  </div>

  <!-- 글로벌 K-뷰티 -->
  <div class="card">
    <div class="card-hd">
      <span class="card-title">🌍 글로벌 K-뷰티</span>
      <span class="card-sub">국가별 키워드</span>
    </div>
    <table class="global-tbl" id="globalTable"></table>
    <div style="padding:6px 12px;font-size:9px;color:var(--txt3);border-top:.5px solid var(--bd)">
      ※ 소스: Google Trends · TikTok Beauty · Mintel GPC · Euromonitor 2026
    </div>
  </div>

  <!-- 글로벌 트렌드 -->
  <div class="card">
    <div class="card-hd">
      <span class="card-title">🌍 글로벌 트렌드 — 추천 업체</span>
      <button class="btn-sm" onclick="goToGlobalSearch()">🔍 신규 발굴</button>
    </div>
    <div id="globalRecList"></div>
  </div>
</div>

<!-- ══ ROW 2: 이슈/뉴스 + 법령 (전체 너비) ══ -->
<div class="row2">
  <div class="card">
    <div class="card-hd">
      <span class="card-title">📰 이슈 + 뷰티뉴스</span>
      <span class="card-sub" id="newsCount"></span>
    </div>
    <div class="stab-bar">
      <button class="stab on" onclick="setNewsTab('all',this)">전체</button>
      <button class="stab" onclick="setNewsTab('trend',this)">트렌드</button>
      <button class="stab" onclick="setNewsTab('reg',this)">규제·법령 🔴</button>
      <button class="stab" onclick="setNewsTab('action',this)">행정처분</button>
      <button class="stab" onclick="setNewsTab('ingr',this)">성분이슈</button>
      <button class="stab" onclick="setNewsTab('global',this)">글로벌</button>
    </div>
    <div class="news-grid" id="newsList"></div>
  </div>
</div>

<!-- ══ ROW 2b: 법령·인사이트 2열 ══ -->
<div class="row3" style="margin-bottom:10px">
  <!-- 법령·규제 변화 -->
  <div class="card">
    <div class="card-hd">
      <span class="card-title">⚖️ 법령·규제 변화 (필수 모니터링)</span>
      <span class="card-sub" style="color:var(--red);font-weight:600">즉시 대응 필요</span>
    </div>
    <div id="regList"></div>
  </div>
  <!-- 통합 인사이트 -->
  <div class="card">
    <div class="card-hd">
      <span class="card-title">💡 트렌드 인사이트 요약</span>
      <span class="card-sub">국내·글로벌·규제 종합</span>
    </div>
    <div id="insightList"></div>
  </div>
</div>

<!-- ══ ROW 3: TOP10 2열 ══ -->
<div class="row3">
  <!-- 올리브영 TOP10 -->
  <div class="card">
    <div class="card-hd">
      <span class="card-title">🛍 올리브영 TOP10</span>
      <span class="card-sub">카테고리 베스트 · 샘플</span>
    </div>
    <div class="stab-bar">
      <button class="stab on" onclick="setOyTab('스킨케어',this)">스킨케어</button>
      <button class="stab" onclick="setOyTab('마스크팩',this)">마스크팩</button>
      <button class="stab" onclick="setOyTab('클렌징',this)">클렌징</button>
      <button class="stab" onclick="setOyTab('선케어',this)">선케어</button>
      <button class="stab" onclick="setOyTab('제조업체',this)">🏭 제조업체</button>
    </div>
    <div id="oyList"></div>
  </div>

  <!-- 급상승 TOP10 -->
  <div class="card">
    <div class="card-hd">
      <span class="card-title">🔎 급상승 TOP10</span>
      <span class="card-sub">DataLab · 소스: 네이버·구글·틱톡</span>
    </div>
    <div class="stab-bar">
      <button class="stab on" onclick="setRisingTab('prod',this)">급상승 제품</button>
      <button class="stab" onclick="setRisingTab('mfr',this)">🏭 급상승 제조업체</button>
    </div>
    <div id="risingList"></div>
  </div>
</div>

</div><!-- /wrap -->

/* ════ 법령·규제 ════ */
function renderRegList() {
  const el=document.getElementById('regList');
  el.innerHTML=REGULATIONS.map(r=>{
    const cls=r.level==='critical'?'critical':r.level==='upcoming'?'upcoming':'';
    const lv ={critical:'badge-red',upcoming:'badge-yel',info:'badge-gray'}[r.level]||'badge-gray';
    const affHtml=(r.affected||[]).map(a=>`<span class="badge badge-gray" style="font-size:8px">${a}</span>`).join(' ');
    const link=r.url?` <a href="${r.url}" target="_blank" style="font-size:9px;color:var(--cyn)">↗</a>`:'';
    return `<div class="reg-item ${cls}">
      <div class="news-flag">
        <span class="badge ${lv}">${r.tag}</span>
        <span style="font-size:9px;color:var(--txt3)">${r.date} · ${r.authority}</span>
      </div>
      <div class="reg-title">${r.title}${link}</div>
      <div style="font-size:9px;color:var(--txt2);margin-top:2px;line-height:1.5">${r.detail}</div>
      <div style="margin-top:3px">${affHtml}</div>
      <span class="reg-impact ${r.impact}">${r.impactTxt}</span>
      <div style="font-size:10px;color:var(--cyn);margin-top:4px;font-style:italic">📌 ${r.action}</div>
    </div>`;
  }).join('');
}

     txt:`즉시 대응 필요 규제 ${regCrit}건. 레티놀 기준 강화(7월), EU 미세플라스틱 금지(2027). OEM 업체 원료 재검토 필수.`,
     action:'생산 품목 레티놀 함유 여부 전수 점검'},
    {label:'🏭 공급망 현황',
     txt:`내부 DB ${DB_REAL.length}개 업체 (CONFIRMED ${DB_REAL.filter(d=>d.status==='CONFIRMED').length}곳). CGMP ${DB_REAL.filter(d=>d.certs.includes('CGMP')).length}곳, ISO22716 ${DB_REAL.filter(d=>d.certs.some(c=>c.includes('ISO22716'))).length}곳.`,
     action:'SHADOW 업체 정식 등록평가 리스트 검토 필요'},
  ];
  const el=document.getElementById('insightList');
  el.innerHTML=insights.map(ins=>`
    <div class="insight-row">
      <div class="insight-label">${ins.label}</div>
      <div class="insight-txt">${ins.txt}</div>
      <div class="insight-action">📌 ${ins.action}</div>
    </div>`).join('');
}

/* ════ 뉴스 ════ */
function renderTrendNews() {
  const news=TREND_NEWS[trendPeriod]||TREND_NEWS.week;
  const tagMap={all:null,trend:'트렌드',reg:'규제',action:'행정처분',ingr:'성분이슈',global:'글로벌'};
  const filter=tagMap[newsTab];
  const list=filter?news.filter(n=>n.tag===filter||n.flag===filter):news;
  document.getElementById('newsCount').textContent=list.length+'건';
  const el=document.getElementById('newsList');
  if(!list.length){el.innerHTML='<div class="empty">해당 항목 없음</div>';return;}
  el.innerHTML=list.map(n=>{
    const cls=n.flag==='action'||n.flag==='issue'?'issue':n.flag==='warn'?'warn':'';
    const bdg={action:'badge-red',issue:'badge-red',warn:'badge-yel',global:'badge-pur',info:'badge-gray'}[n.flag]||'badge-gray';
    const chips=(n.relDB_ids||[]).map(id=>{
      const d=DB_REAL.find(x=>x.id===id);
      if(!d)return '';
      return `<button class="db-chip ${d.status==='CONFIRMED'?'confirmed':'shadow'}" onclick="goToDbDetail(${d.id})">${d.name} ✓</button>`;
    }).join('');
    const la=n.url?`onclick="window.open('${n.url}','_blank')"` :'';
    return `<div class="news-item ${cls}" style="${n.url?'cursor:pointer':''}" ${la}>
      <div class="news-flag"><span class="badge ${bdg}">${n.tag}</span><span style="font-size:9px;color:var(--txt3)">${n.date}</span></div>
      <div class="news-title">${n.title}${n.url?' <span style="font-size:9px;color:var(--cyn)">↗</span>':''}</div>
      <div class="news-meta">${n.detail}</div>
      ${chips?`<div class="news-db-row">${chips}</div>`:''}
    </div>`;
  }).join('');
}
function setNewsTab(tab,el){newsTab=tab;el.closest('.card').querySelectorAll('.stab').forEach(t=>t.classList.remove('on'));el.classList.add('on');renderTrendNews();}

/* ════ 국내 추천 업체 ════ */
function capableFor(d, prodName) {
  const kwMap={'선크림':'선케어','선케어':'선케어','선스틱':'선케어','SPF':'선케어','마스크팩':'마스크','마스크':'마스크','하이드로겔':'마스크','세럼':'기초','앰플':'기초','크림':'기초','에센스':'기초','클렌저':'클렌징','클렌징':'클렌징'};
  for(const kw of Object.keys(kwMap)) { if(prodName.includes(kw)) return true; }
  // 업종으로 판단
  const ind=d.industry.toLowerCase();
  return ind.includes('화장품') || ind.includes('제조');
}
function renderTrendRecommend() {
  const prods=RISING_PRODS[trendPeriod]||RISING_PRODS.week;
  const top1=prods[0];
  const hintTxt=prods.filter(p=>p.pct>0).slice(0,3).map(p=>`${p.name} ▲${p.pct}%`).join(' · ');
  document.getElementById('trendHint').textContent='💡 '+hintTxt;
  // CONFIRMED 업체에서 화장품 제조 가능 필터
  let capable=DB_REAL.filter(d=>d.industry.includes('화장품')||d.industry.includes('제조'));
  if(showNewOnly) capable=capable.filter(d=>d.status!=='CONFIRMED'); // 미거래=SHADOW
  capable=capable.sort((a,b)=>(b.certs.length-a.certs.length));
  const el=document.getElementById('trendRecList');
  if(!capable.length){el.innerHTML='<div class="no-supply"><p>조건에 맞는 업체 없음</p><button class="btn-find" onclick="goToTrendSearch()">TAB03 발굴 →</button></div>';return;}
  el.innerHTML=capable.slice(0,4).map(c=>{
    const statBadge=c.status==='CONFIRMED'?'<span class="badge badge-grn">✓</span>':'<span class="badge badge-sky">🕵</span>';
    const certHtml=(c.certs||[]).slice(0,3).map(cert=>`<span class="cert-chip">${cert}</span>`).join('');
    const mgrTxt=c.mgr?.세종||c.mgr?.부천||'';
    return `<div class="rec-card">
      <div class="rec-head"><span class="rec-name">${c.name}</span>${statBadge}</div>
      <div class="rec-meta">${c.region} · ${mgrTxt?'담당: '+mgrTxt:''}</div>
      <div class="rec-certs">${certHtml||'<span style="font-size:9px;color:var(--txt3)">인증 없음</span>'}</div>
      <div class="rec-actions">
        <button class="btn-det" onclick="goToDbDetail(${c.id})">상세보기 →</button>
        <button class="btn-srch" onclick="goToTrendSearch()">TAB03 →</button>
      </div>
    </div>`;
  }).join('')+(capable.length>4?`<div style="padding:6px 12px;font-size:10px;color:var(--cyn);cursor:pointer;text-align:right" onclick="goToTrendSearch()">+ ${capable.length-4}개 더보기 →</div>`:'');
}
function toggleNewOnly(btn){showNewOnly=!showNewOnly;btn.classList.toggle('on',showNewOnly);renderTrendRecommend();}

/* ════ 글로벌 ════ */
function renderGlobalTable(){

  t.innerHTML='<thead><tr><th>국가</th><th>키워드</th><th>성장</th><th>인증</th></tr></thead><tbody>'+
  GLOBAL_TRENDS.map(g=>{

  }).join('')+'</tbody>';
}
function renderGlobalRecommend(){
  const certT=['FDA','할랄','비건','CE'];
  const capable=DB_REAL.filter(d=>d.certs&&d.certs.some(c=>certT.includes(c))).sort((a,b)=>b.certs.length-a.certs.length);

  el.innerHTML=capable.slice(0,4).map(c=>{
    const certHtml=(c.certs||[]).filter(cert=>certT.some(t=>cert.includes(t))).slice(0,3).map(cert=>`<span class="cert-chip">${cert}</span>`).join('');
    const statBadge=c.status==='CONFIRMED'?'<span class="badge badge-grn">✓</span>':'<span class="badge badge-sky">🕵</span>';
    return `<div class="rec-card">
      <div class="rec-head"><span class="rec-name">${c.name}</span>${statBadge}</div>
      <div class="rec-meta">${c.region} · ${c.addr.slice(0,25)}</div>
      <div class="rec-certs">${certHtml}</div>
      <div class="rec-actions">
        <button class="btn-det" onclick="goToDbDetail(${c.id})">상세보기 →</button>
        <button class="btn-srch" onclick="goToGlobalSearch()">TAB03 →</button>
      </div>
    </div>`;
  }).join('')+(capable.length>4?`<div style="padding:6px 12px;font-size:10px;color:var(--cyn);text-align:right;cursor:pointer" onclick="goToGlobalSearch()">+ ${capable.length-4}개 더보기 →</div>`:'');
}

/* ════ 올리브영 ════ */
function renderOYTop(){

    el.innerHTML=items.map(item=>{

        <div style="flex:1"><div class="mfr-name-txt">${item.mfr}</div>

    const mfrHtml=p.mfr?`<span class="mfr-ok">${p.mfr} ✓</span>`+(dbE?` <button class="btn-db" onclick="goToDbDetail(${dbE.id})">DB</button>`:''):`<span class="mfr-na">미확인 <button class="btn-add" onclick="openMfdsModal('${p.name}')">+DB등록</button></span>`;

function setOyTab(tab,el){oyTab=tab;el.closest('.card').querySelectorAll('.stab').forEach(t=>t.classList.remove('on'));el.classList.add('on');renderOYTop();}

/* ════ 급상승 ════ */
function renderRisingTab(){risingTab==='prod'?renderRisingProds():renderRisingMfr();}
function setRisingTab(tab,el){risingTab=tab;el.closest('.card').querySelectorAll('.stab').forEach(t=>t.classList.remove('on'));el.classList.add('on');renderRisingTab();}
function renderRisingProds(){
  const items=RISING_PRODS[trendPeriod]||RISING_PRODS.week;
  const el=document.getElementById('risingList');

    const rankCls=p.rank<=3?`r${p.rank}`:'';
    const dbE=p.dbId?DB_REAL.find(d=>d.id===p.dbId):null;
    const mfrHtml=p.mfr?`<span class="mfr-ok">${p.mfr} ✓</span>`+(dbE?` <button class="btn-db" onclick="goToDbDetail(${dbE.id})">DB</button>`:''):`<span class="mfr-na">미확인</span>`;
    const stCls=p.pct>=0?'stat-up':'stat-dn';

    const rankCls=m.rank<=3?`r${m.rank}`:'';
    const dbE=m.dbName?DB_REAL.find(d=>d.name===m.dbName):null;
    const btn=dbE?`<button class="btn-db" onclick="goToDbDetail(${dbE.id})">DB✓</button>`:
      `<button class="btn-add" onclick="openMfdsModal('${m.name}')">+추가</button>`;
    return `<div class="mfr-item"><div class="rank ${rankCls}">${m.rank}</div>
      <div style="flex:1"><div class="mfr-name-txt">${m.name}</div>
      <div class="mfr-sub">${m.signal}</div></div>
      <div style="display:flex;align-items:center;gap:5px">
        <span class="stat-up">▲${m.pct}%</span>${btn}
      </div>
    </div>`;

}

/* ════ 보고서 복사 ════ */
function copyReport(){
  const prods=RISING_PRODS[trendPeriod]||RISING_PRODS.week;
  const now=new Date();
  const sep='━'.repeat(40);
  const periodTxt=document.getElementById('periodLabel').textContent;
  let lines=[];
  lines.push('[트렌드 분석 보고서] '+now.toLocaleDateString('ko-KR')+' 기준: '+periodTxt);
  lines.push(sep);
  lines.push('');
  lines.push('▶ 즉시 Action 필요');
  (TREND_NEWS[trendPeriod]||[]).filter(n=>n.flag==='action').forEach(n=>{lines.push('  ⚠ '+n.title);});
  REGULATIONS.filter(r=>r.level==='critical').forEach(r=>{lines.push('  ⚖ '+r.title+' ('+r.date+')');});
  lines.push('');
  lines.push('▶ 급상승 TOP5');
  prods.slice(0,5).forEach(p=>{lines.push('  '+p.rank+'. '+p.name+' ▲'+p.pct+'% ['+p.src+']');});
  lines.push('');
  lines.push('▶ 글로벌 시장');
  GLOBAL_TRENDS.forEach(g=>{lines.push('  '+g.country+' '+g.growth+': '+g.keywords.join('·'));});
  lines.push('');
  lines.push('▶ 내부 DB: '+DB_REAL.length+'개 업체 (CONFIRMED '+DB_REAL.filter(d=>d.status==='CONFIRMED').length+'곳)');
  lines.push('  CGMP '+DB_REAL.filter(d=>d.certs.includes('CGMP')).length+'곳'+
    ' · 비건 '+DB_REAL.filter(d=>d.certs.includes('비건')).length+'곳'+
    ' · 할랄 '+DB_REAL.filter(d=>d.certs.includes('할랄')).length+'곳');
  const txt=lines.join('\n');
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.querySelector('.report-btn');
    const orig=btn.textContent;
    btn.textContent='✓ 복사됨';btn.style.color='var(--grn)';
    setTimeout(()=>{btn.textContent=orig;btn.style.color='';},2000);
  }).catch(()=>alert(txt));
}
